        `Aplica mais aí, pão-duro. Dinheiro parado na conta não rende nada.`,
        `Tá olhando o investimento de novo? Ele não vai crescer mais rápido porque você tá olhando.`,
        `Resgatar? Nem pensa nisso.`);
      if (v.ir !== false) L.push(`O IR leva ${fmtPct(irAt(v, today()) * 100)} do teu rendimento. O leão agradece.`);
    }
    L.push(`O CDI tá ${fmtPct(S.cdi)} e você aí, parado.`);
    return L;
  }
  if (tab === 'prev') {
    let firstNeg = null, worst = null;
    for (let k = 0; k < 12; k++) {
      const mm = shiftMonth(m, k), x = monthTotals(mm), b = x.i - x.o - x.inv;
      if (b < 0 && !firstNeg) firstNeg = mm;
      if (!worst || b < worst.b) worst = { mm, b };
    }
    if (firstNeg) L.push('Com essa previsão aqui a gente não vai durar muito tempo.', `${cap(monthLabel(firstNeg).toLowerCase())} no vermelho. Já pode ir procurando um bico.`);
    else L.push('Previsão toda positiva... por enquanto. Espera o próximo iFood.', 'Tá tudo azul na previsão. Desconfio.');
    if (worst) L.push(`O pior mês é ${monthLabel(worst.mm).toLowerCase()}: sobra ${signedMoney(worst.b)}. Se prepara.`);
    const fixedTotal = monthTx(shiftMonth(m, 1)).filter((t) => t.rule && t.type === 'out').reduce((a, t) => a + t.amount, 0);
    if (fixedTotal) L.push(`Só de conta fixa no mês que vem são ${money(fixedTotal)}. E você aí querendo viajar.`);
    L.push('Olhando o futuro? Eu já vi. Não é bonito.');
    return L;
  }
  if (tab === 'list') {
    const n = monthTx(ui.month).filter((t) => t.type === 'out').length;
    L.push('Vixe, já vai colocar mais gasto?', 'Procurando aquele gasto que você esqueceu de anotar?', 'Lista grande, hein. Tá gastando por esporte?');
    if (n) L.push(`${n} gasto${n > 1 ? 's' : ''} em ${monthLabel(ui.month).toLowerCase()}. E contando.`);
    const food = monthTx(ui.month).filter((t) => t.cat === 'restaurantes').length;
    if (food >= 3) L.push(`${food} vezes comendo fora esse mês. Fogão de casa tá de enfeite?`);
    return L;
  }
  if (tab === 'cfg') return ['Mexendo nos ajustes? Vai me desligar, é? Tenta.', 'Se tirar o pato, o app perde a graça. Só avisando.', 'Faz backup aí. Depois não vem chorar.'];
  return [];
}
function pickDuckLine() {
  const { urgent, L } = duckLines();
  const tabL = duckTabLines(ui.tab);
  // fora do Resumo, fala mais da aba aberta; no Resumo, metade das vezes cobra conta, se tiver
  let pool;
  if (tabL.length && Math.random() < 0.65) pool = tabL;
  else if (urgent.length && Math.random() < 0.55) pool = urgent;
  else pool = L.concat(urgent);
  return duckFresh(pool);
}
// Escolhe uma fala que não saiu há pouco tempo. Lembra das últimas 60, mesmo fechando o app
// (chave própria, separada dos dados financeiros).
function duckFresh(pool) {
  if (!duck.heard) { try { duck.heard = JSON.parse(localStorage.getItem('financas.pato.falas')) || []; } catch (e) { duck.heard = []; } }
  let fresh = pool.filter((s) => !duck.heard.includes(s));
  if (!fresh.length) {
    // todas já saíram: usa a que saiu há mais tempo
    fresh = pool.slice().sort((a, b) => duck.heard.indexOf(b) - duck.heard.indexOf(a)).slice(0, 3);
  }
  const line = pick(fresh);
  duck.heard = [line, ...duck.heard.filter((s) => s !== line)].slice(0, 60);
  try { localStorage.setItem('financas.pato.falas', JSON.stringify(duck.heard)); } catch (e) { /* sem espaço: tudo bem */ }
  return line;
}
// Ao entrar numa aba, ele comenta sobre ela (mais vezes quanto mais chato).
function duckOnTab() {
  if (duckLevel() === 'off') return;
  const chance = { calm: 0.3, zoeiro: 0.7, chato: 1 }[duckLevel()];
  if (Math.random() > chance) return;
  const tabL = duckTabLines(ui.tab);
  const pool = tabL.length ? tabL : duckLines().urgent.concat(duckLines().L);
  clearTimeout(duck.tabT);
  duck.tabT = setTimeout(() => {
    if (!sheetsClosed()) return;
    duckSay(duckFresh(pool));
  }, 1200);
}
// Depois de salvar um lançamento novo, ele reage.
function duckOnSave(tx) {
  if (duckLevel() === 'off' || !tx) return;
  const chance = { calm: 0.35, zoeiro: 0.75, chato: 1 }[duckLevel()];
  if (Math.random() > chance) return;
  const c = catOf(tx.cat).name.toLowerCase();
  let lines;
  if (tx.type === 'in') {
    lines = [`Opa, ${money(tx.amount)} entrando! Não gasta tudo de uma vez.`, 'Dinheiro entrando? Finalmente uma notícia boa.',
      'Receita anotada. Agora segura pra não sair tudo no fim de semana.', 'Entrou dinheiro. Já separa um pouco antes de gastar.',
      'Olha só, dinheiro chegando. Vou ficar de guarda.', 'Receita! Guarda uma parte. Por mim.'];
    tagPose(lines, 'aplaude');
  } else {
    // tipo da compra: grande, repetida, pequena por impulso ou comum
    const desde = addMonthsISO(today(), -2);
    const outs = S.tx.filter((t) => t.type === 'out' && t.date >= desde && t.id !== tx.id);
    const media = outs.length ? outs.reduce((a, t) => a + t.amount, 0) / outs.length : 0;
    const mesCat = monthTx(tx.date.slice(0, 7)).filter((t) => t.type === 'out' && t.cat === tx.cat).length;
    const fill = (arr) => arr.map((s) => s.replace('{v}', money(tx.amount)).replace(/\{c\}/g, c).replace('{n}', mesCat));
    if (media && tx.amount >= media * 2.5 && tx.amount >= 15000) lines = tagPose(fill(DUCK_GRANDE), 'cobre');
    else if (mesCat >= 3 && !tx.rule) lines = tagPose(fill(DUCK_REPETIDA), 'bracos');
    else if (tx.amount <= 3000 && !tx.rule) lines = tagPose(fill(DUCK_IMPULSO), 'aponta');
    else lines = tagPose(fill(DUCK_COMPRA).concat(`Vixe, mais ${money(tx.amount)} em ${c}.`, `${money(tx.amount)}? Precisava mesmo?`), 'oculos');
  }
  // piada sobre o assunto (carro, lanche, streaming, aluguel...) na maioria das vezes
  const tema = duckTema(tx);
  if (tema && Math.random() < 0.75) {
    let tl = tema.lines;
    if (tema.tipo === 'stream') {
      const k = duckStreamings(tx.date.slice(0, 7));
      if (k.length >= 2) tl = tl.concat(`Já são ${k.length} streamings: ${k.join(', ')}. Vira uma locadora logo.`);
    }
    setTimeout(() => duckSay(duckFresh(tl), tema.pose), 700);
    return;
  }
  setTimeout(() => duckSay(duckFresh(lines)), 700);
}
function scheduleTalk(ms) {
  const lv = duckLevel();
  const base = ms != null ? ms : lv === 'calm' ? 60000 + Math.random() * 40000 : lv === 'chato' ? 10000 + Math.random() * 10000 : 25000 + Math.random() * 20000;
  duck.nextTalk = performance.now() + base;
}
const sheetsClosed = () => !document.querySelector('.wrap.open');
function duckSay(text, pose) {
  const b = $('#dbub');
  text = text || pickDuckLine();
  b.textContent = text;
  // vira de frente e faz o gesto da fala (sem gesto enquanto está sendo carregado ou voando)
  if (!duck.drag && duck.state === 'walk') {
    // metade das vezes usa a pose que combina com a fala; senão sorteia entre todas. Nunca repete a última.
    const outras = Object.keys(DUCK_POSES).filter((k) => k !== duck.lastPose);
    const combina = pose || DUCK_POSE.get(text);
    const nome = combina && combina !== duck.lastPose && (pose || Math.random() < 0.5) ? combina : pick(outras);
    duck.lastPose = nome;
    const p = DUCK_POSES[nome];
    const now = performance.now();
    duck.pose = { ...p, t0: now, until: now + 6000 };
  }
  b.classList.add('show');
  duck.pauseUntil = performance.now() + 6500;
  clearTimeout(duck.hideT);
  duck.hideT = setTimeout(() => b.classList.remove('show'), 6500);
  scheduleTalk();
}
function duckTick(t) {
  duck.raf = requestAnimationFrame(duckTick);
  const el = $('#duck');
  const dt = Math.min(0.05, (t - (duck.lastT || t)) / 1000);
  duck.lastT = t;
  const W = document.documentElement.clientWidth, size = 52;
  const top = Math.max(120, window.innerHeight - 220); // altura máxima que ele pode subir
  if (duck.state === 'fly') {
    // jogado: gravidade, quica nas bordas e no chão
    duck.vy -= 2200 * dt;
    duck.x += duck.vx * dt; duck.y += duck.vy * dt;
    duck.rot += duck.vx * dt * 0.9;
    if (duck.x < 0) { duck.x = 0; duck.vx = -duck.vx * 0.6; }
    if (duck.x > W - size) { duck.x = W - size; duck.vx = -duck.vx * 0.6; }
    if (duck.y > top) { duck.y = top; duck.vy = -Math.abs(duck.vy) * 0.4; }
    if (duck.y <= 0) {
      duck.y = 0;
      if (duck.vy < -380) { duck.vy = -duck.vy * 0.35; duck.vx *= 0.7; }
      else { duck.state = 'walk'; duck.vx = duck.vy = 0; duck.rot = 0; duckLanded(); }
    }
  }
  const walking = duck.state === 'walk' && t > duck.pauseUntil && sheetsClosed();
  if (walking) {
    duck.x += duck.dir * duck.speed * dt;
    if (duck.x > W - size - 6) { duck.x = W - size - 6; duck.dir = -1; }
    if (duck.x < 6) { duck.x = 6; duck.dir = 1; }
    if (Math.random() < 0.0015) duck.dir *= -1; // muda de ideia de vez em quando
  }
  el.classList.toggle('walk', walking);
  // quadro do desenho: de frente durante a fala; andando, o passo acompanha a distância (o pé não escorrega)
  let fx = 0, fy = 0, front = false;
  const now = performance.now(); // mesmo relógio do duckSay (o t do requestAnimationFrame pode vir atrasado)
  if (duck.pose && now < duck.pose.until && !duck.drag && duck.state === 'walk') {
    front = true; fy = duck.pose.row || 0;
    const e = Math.max(0, now - duck.pose.t0);
    fx = e < 880 ? Math.min(3, Math.floor(e / 220)) : duck.pose.loop ? 2 + Math.floor(e / 300) % 2 : 3;
  } else {
    duck.pose = null;
    if (walking) duck.dist = (duck.dist || 0) + duck.speed * dt;
    else if (duck.drag) duck.dist = (duck.dist || 0) + 40 * dt; // pernas pedalando no ar
    // o ciclo de 32 quadros anda 14,17 px na tela (56,67 px no quadro de 256): 0,443 px por quadro
    const f = Math.max(0, Math.floor((duck.dist || 0) / 0.443)) % 32;
    fx = f % 8; fy = Math.floor(f / 8);
  }
  el.classList.toggle('front', front);
  const cw = front ? 52 : 64, ch = front ? 49 : 64;
  $('.dfr').style.backgroundPosition = `${-fx * cw}px ${-fy * ch}px`;
  el.style.transform = `translate(${duck.x}px, ${-duck.y}px)`;
  $('#dsprite').style.transform = `scaleX(${front ? 1 : duck.dir}) rotate(${duck.rot}deg)`;
  // balão sempre dentro da tela
  const b = $('#dbub'), bw = b.offsetWidth;
  b.style.left = Math.max(8 - duck.x, Math.min(size / 2 - bw / 2, W - 8 - duck.x - bw)) + 'px';
  if (duck.state === 'walk' && t > duck.nextTalk && sheetsClosed() && document.visibilityState === 'visible') duckSay();
}
// Cara brava por alguns segundos.
function duckAngry(ms = 4000) {
  const el = $('#duck');
  el.classList.remove('angry'); void el.offsetWidth; el.classList.add('angry');
  clearTimeout(duck.angryT);
  duck.angryT = setTimeout(() => el.classList.remove('angry'), ms);
}
function duckLanded() {
  if (duck.throwSpeed > 1100) {
    duckAngry(5000);
    duckSay(duckFresh(['AAAAH! Tá maluco?!', 'Ei! Isso é jeito de tratar um pato?', 'Me jogou?! Vou contar teus gastos pra todo mundo.',
      'Ai, minha asa! Vou cobrar o tratamento no teu cartão.', 'Faz isso de novo e eu apago teu saldo. Brincadeira. Ou não.',
      'Tá descontando em mim porque a fatura veio alta?']));
  } else {
    duckSay(duckFresh(['Me põe no chão direito, pô.', 'Pato não voa assim, tá?', 'Ufa. Chão.', 'Da próxima vez, me avisa antes.']));
  }
}
function duckStart() {
  const el = $('#duck');
  if (duckLevel() === 'off') { el.hidden = true; cancelAnimationFrame(duck.raf); duck.raf = 0; $('#dbub').classList.remove('show'); return; }
  el.hidden = false;
  scheduleTalk(6000);
  if (!duck.raf) { duck.lastT = 0; duck.raf = requestAnimationFrame(duckTick); }
}
// Tocar = cutucar; segurar e arrastar = carregar; soltar arrastando rápido = jogar.
function duckPoke() {
  const now = Date.now();
  duck.taps = duck.taps.filter((x) => now - x < 4000).concat(now);
  if (duck.taps.length >= 3) {
    duckAngry();
    duckSay(duckFresh(['Para de me cutucar!', 'Ei! Vai cutucar tua fatura.', 'Mais um toque e eu conto teus gastos pra todo mundo.',
      'Tá carente? Vai ver teu extrato.', 'Para! Eu bico, hein.']));
  } else duckSay();
}
$('#duck').addEventListener('pointerdown', (e) => {
  const el = $('#duck');
  try { el.setPointerCapture(e.pointerId); } catch (err) { /* segue sem captura */ }
  duck.drag = { id: e.pointerId, cx: e.clientX, cy: e.clientY, x0: duck.x, y0: duck.y, moved: false, samples: [[e.clientX, e.clientY, performance.now()]] };
});
$('#duck').addEventListener('pointermove', (e) => {
  const d = duck.drag;
  if (!d || d.id !== e.pointerId) return;
  if (!d.moved && Math.hypot(e.clientX - d.cx, e.clientY - d.cy) > 8) {
    d.moved = true;
    duck.state = 'drag'; duck.rot = 0;
    $('#duck').classList.add('drag');
    duckSay(duckFresh(['Ei! Me solta!', 'Pra onde você tá me levando?', 'Sequestro de pato! Socorro!', 'Me larga, eu tenho contas pra cobrar!']));
  }
  if (!d.moved) return;
  const W = document.documentElement.clientWidth;
  duck.x = Math.max(0, Math.min(W - 52, d.x0 + (e.clientX - d.cx)));
  duck.y = Math.max(0, d.y0 - (e.clientY - d.cy));
  if (e.clientX !== d.samples[d.samples.length - 1][0]) duck.dir = e.clientX > d.samples[d.samples.length - 1][0] ? 1 : -1;
  d.samples.push([e.clientX, e.clientY, performance.now()]);
  if (d.samples.length > 6) d.samples.shift();
});
function duckRelease(e) {
  const d = duck.drag;
  if (!d || d.id !== e.pointerId) return;
  duck.drag = null;
  $('#duck').classList.remove('drag');
  if (!d.moved) { duckPoke(); return; }
  // velocidade do arraste (px/s) a partir dos últimos movimentos do dedo
  const a = d.samples[0], z = d.samples[d.samples.length - 1], dtS = Math.max(0.016, (z[2] - a[2]) / 1000);
  duck.vx = (z[0] - a[0]) / dtS;
  duck.vy = -(z[1] - a[1]) / dtS;
  duck.throwSpeed = Math.hypot(duck.vx, duck.vy);
  duck.state = 'fly';
}
$('#duck').addEventListener('pointerup', duckRelease);
$('#duck').addEventListener('pointercancel', duckRelease);

// Tema: escuro é o padrão. A barra de status do iPhone segue o tema na próxima abertura do app.
function applyTheme() {
  const light = S.theme === 'light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  document.querySelector('meta[name="theme-color"]').content = light ? '#f5f1e8' : '#000000';
  document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = light ? 'default' : 'black-translucent';
}

applyTheme();
render();
duckStart();
// Voltou de um recarregamento pedido pelo 🎤: reabre a janela de voz já ouvindo.
try {
  if (sessionStorage.getItem('autoVoice')) { sessionStorage.removeItem('autoVoice'); setTimeout(() => openInv('voice'), 350); }
} catch (e) {}
refreshCdi();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !wrap.hidden) return; // não atrapalha um lançamento sendo digitado
  render();
  refreshCdi();
});
// Botão "Buscar atualização": só com internet (sem ela, apagar o cache deixaria o app sem abrir offline).
// Apaga a cópia do código guardada (os dados ficam no localStorage, não são tocados) e recarrega.
async function forceUpdate() {
  toast('Buscando atualização…');
  try {
    const r = await fetch('sw.js?check=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('offline');
  } catch (e) { toast('Sem internet: tente de novo quando estiver conectado'); return; }
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) { /* segue para recarregar mesmo assim */ }
  location.reload();
}

// Atualização: procura versão nova ao abrir e ao voltar para o app; quando o service worker
// novo assume, recarrega sozinho uma vez (não precisa abrir duas vezes).
// No PC (localhost) não usa service worker: sempre carrega os arquivos novos e funciona até no
// navegador do Claude, onde o service worker não consegue buscar nada na rede.
const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
if (isLocal && 'serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
  fetch('sw.js', { cache: 'no-store' }).then((r) => r.text()).then((t) => {
    const m = t.match(/VERSION = '([^']+)'/);
    if (m) { ui.appVersion = m[1] + ' (PC)'; if (ui.tab === 'cfg') render(); }
  }).catch(() => {});
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !isLocal) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || !wrap.hidden) return; // não recarrega no meio de um lançamento
    reloaded = true;
    location.reload();
  });
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && e.data.version) { ui.appVersion = e.data.version; if (ui.tab === 'cfg') render(); }
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
    navigator.serviceWorker.ready.then((reg) => reg.active && reg.active.postMessage('version'));
  });
}
})();
