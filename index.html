  // Arrasta só quando a janela está rolada no topo; passou de 90px (ou foi rápido), fecha.
  let y0 = null, dy = 0, t0 = 0;
  sheet.addEventListener('touchstart', (e) => {
    if (sheet.scrollTop > 0 || e.touches.length > 1) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now();
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || sheet.scrollTop > 0) { if (dy < 0) y0 = null; sheet.classList.remove('drag'); sheet.style.transform = ''; return; }
    sheet.classList.add('drag');
    sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (y0 == null) return;
    const fast = dy > 40 && Date.now() - t0 < 250;
    sheet.classList.remove('drag');
    sheet.style.transform = '';
    if (dy > 90 || fast) closeWrap(w);
    y0 = null; dy = 0;
  });
});

// Acha a piada que combina com um lançamento. Devolve { lines, pose } ou null.
function duckTema(tx) {

  const desc = norm(tx.desc || ''), cat = tx.cat;
  const lista = tx.type === 'in' ? DUCK_TEMAS_IN : DUCK_TEMAS;
  const tema = lista.find((t) => t.re && desc && t.re.test(' ' + desc + ' ')) || lista.find((t) => t.cat && t.cat === cat);
  if (!tema) return null;
  const mes = (tx.date || today()).slice(0, 7);
  const n = monthTx(mes).filter((t) => t.type === tx.type && (tema.re ? tema.re.test(' ' + norm(t.desc || '') + ' ') : t.cat === cat)).length || 1;
  const nomeDesc = (tx.desc || catOf(cat).name).trim();
  const fill = (s) => s.replace(/\{v\}/g, money(tx.amount)).replace(/\{d\}/g, nomeDesc).replace(/\{c\}/g, catOf(cat).name.toLowerCase())
    .replace(/\{dia\}/g, +String(tx.date || today()).slice(8, 10)).replace(/\{n\}/g, n);
  let base = tema.lines;
  if (tema.caras && tx.amount >= tema.caro) base = tema.caras;
  // falas com {n} só fazem sentido a partir da 2ª vez no mês
  // {outro}: outro streaming que a pessoa já paga no mês (some se não tiver)
  const outro = tema.tipo === 'stream' ? duckStreamings(mes).find((x) => norm(x) !== norm(nomeDesc)) : null;
  const lines = base.filter((s) => (!s.includes('{n}') || n >= 2) && (!s.includes('{outro}') || outro))
    .map((s) => fill(s).replace(/\{outro\}/g, outro));
  return lines.length ? { lines, pose: tema.pose || (tx.type === 'in' ? 'aplaude' : 'oculos'), tipo: tema.tipo } : null;
}

function duckFresh(pool) {

  let fresh = pool.filter((s) => !duck.heard.includes(s));
  if (!fresh.length) {

    fresh = pool.slice().sort((a, b) => duck.heard.indexOf(b) - duck.heard.indexOf(a)).slice(0, 3);
  }
  const line = pick(fresh);
  duck.heard = [line, ...duck.heard.filter((s) => s !== line)].slice(0, 60);
  try { localStorage.setItem('financas.pato.falas', JSON.stringify(duck.heard)); } catch (e) { /* sem espaço: tudo bem */ }

  const nearL = duck.x < b.minX + 60, nearR = duck.x > b.maxX - 60;
  if ((nearL || nearR) && Math.random() < 0.45) { duckWrap(nearL); return; }
  const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 140;
  const pt = {
    x: Math.max(b.minX, Math.min(b.maxX, duck.x + Math.cos(a) * r)),
    y: Math.max(b.minY, Math.min(b.maxY, duck.y + Math.sin(a) * r)),

function duckTick(t) {
  duck.raf = requestAnimationFrame(duckTick);

  const dt = Math.min(0.05, (t - (duck.lastT || t)) / 1000);
  duck.lastT = t;
  const now = performance.now(); // mesmo relógio do duckSay
  const b = duckBounds();
  if (duck.y < 0) { duck.y = b.maxY - 4; duck.x = 40; }
  const open = sheetsClosed();

  if (duck.state === 'fly') {
    // jogado: escorrega pela tela (vista de cima), perde velocidade e quica nas bordas
    duck.x += duck.vx * dt; duck.y += duck.vy * dt;
    const f = Math.exp(-2.6 * dt); duck.vx *= f; duck.vy *= f;
    duck.rot += duck.vx * dt * 0.9;
    if (duck.x < -DUCK_OUT) duck.x = b.W + DUCK_OUT; // sai por um lado, entra pelo outro
    if (duck.x > b.W + DUCK_OUT) duck.x = -DUCK_OUT;
    if (duck.y < b.topB + 50) { duck.y = b.topB + 50; duck.vy = Math.abs(duck.vy) * 0.6; }
    if (duck.y > b.maxY) { duck.y = b.maxY; duck.vy = -Math.abs(duck.vy) * 0.6; }
    if (Math.hypot(duck.vx, duck.vy) < 35) { duck.state = 'walk'; duck.vx = duck.vy = 0; duck.rot = 0; duckLanded(); }
  }

  // anda até o objetivo (no passeio respeita a pausa da fala; numa cena, não)
  let moving = false;
  if (duck.state === 'walk' && open && !duck.goal && !duck.busy && now > duck.idleUntil && now > duck.pauseUntil) duckWander(now);
  if (duck.state === 'walk' && open && duck.goal && duck.anim !== 'grab' && (duck.busy || now > duck.pauseUntil)) {
    const g = duck.goal, pt = typeof g.pt === 'function' ? g.pt() : g.pt;
    if (!pt) duckAbort();
    else {
      const dx = pt.x - duck.x, dy = pt.y - duck.y, dist = Math.hypot(dx, dy), step = g.speed * dt;
      if (dist > 0.5) duck.dirI = dirFrom(dx, dy);
      if (dist <= step) { duck.x = pt.x; duck.y = pt.y; duck.goal = null; g.res(); }
      else { duck.x += dx / dist * step; duck.y += dy / dist * step; }
      duck.dist = (duck.dist || 0) + Math.min(step, dist);
      moving = true;
    }
  }
  if (duck.drag) duck.dist = (duck.dist || 0) + 40 * dt; // pernas pedalando no ar

  // quadro do desenho
  let fx = 0, fy = 0, cw = 92, ch = 92, front = false, kind = duck.run ? 'run' : 'walk';
  if (duck.pose && now < duck.pose.until && !duck.drag && duck.state === 'walk' && !duck.busy) {
    front = true; fy = duck.pose.row || 0; cw = 52; ch = 49;
    const e = Math.max(0, now - duck.pose.t0);
    fx = e < 880 ? Math.min(3, Math.floor(e / 220)) : duck.pose.loop ? 2 + Math.floor(e / 300) % 2 : 3;
  } else {
    duck.pose = null;
    if (duck.anim === 'grab' && duck.grab) {
      const e = now - duck.grab.t0;
      let g = Math.min(14, Math.floor(e / 42));
      if (duck.grab.reverse) g = 14 - g;
      fx = g % 8; fy = Math.floor(g / 8); kind = 'grab';
      if (e > 15 * 42 + 60) {
        const gr = duck.grab; duck.grab = null; duck.anim = 'walk';
        if (gr.tk === duck.token) gr.res();
      }
    } else if (duck.run) {
      fx = Math.floor((duck.dist || 0) / D8.runPx) % 12; fy = duck.dirI;
    } else {
      fx = moving || duck.drag ? Math.floor((duck.dist || 0) / D8.walkPx) % 16 : 0; fy = duck.dirI;
    }
  }
  el.classList.toggle('front', front);
  el.classList.toggle('run', !front && kind === 'run');
  el.classList.toggle('grab', !front && kind === 'grab');
  $('.dfr').style.backgroundPosition = `${-fx * cw}px ${-fy * ch}px`;
  el.style.transform = `translate(${duck.x}px, ${duck.y}px)`;
  $('#dsprite').style.transform = duck.rot ? `rotate(${duck.rot}deg)` : '';
  if (duck.carry) duckCarryFab(kind, fx);
  // balão sempre dentro da tela (embaixo do pato quando ele está lá no alto)
  const bub = $('#dbub'), bw = bub.offsetWidth;
  bub.style.left = Math.max(8 - duck.x, Math.min(-bw / 2, b.W - 8 - duck.x - bw)) + 'px';
  bub.classList.toggle('below', duck.y < b.topB + 150);
  const onScreen = duck.x > 0 && duck.x < b.W; // escondido do lado de fora não fala sozinho
  if (duck.state === 'walk' && !duck.busy && onScreen && now > duck.nextTalk && open && document.visibilityState === 'visible') duckSay();
}
// Cara brava por alguns segundos.
function duckAngry(ms = 4000) {
  const el = $('#duck');
  el.classList.remove('angry'); void el.offsetWidth; el.classList.add('angry');
  clearTimeout(duck.angryT);
  duck.angryT = setTimeout(() => el.classList.remove('angry'), ms);
}
function duckLanded() {
  if (duck.throwSpeed > 1100) {
    duckAngry(5000);
    duckSay(duckFresh(['AAAAH! Tá maluco?!', 'Ei! Isso é jeito de tratar um pato?', 'Me jogou?! Vou contar teus gastos pra todo mundo.',
      'Ai, minha asa! Vou cobrar o tratamento no teu cartão.', 'Faz isso de novo e eu apago teu saldo. Brincadeira. Ou não.',
      'Tá descontando em mim porque a fatura veio alta?']));
  } else {
    duckSay(duckFresh(['Me põe no chão direito, pô.', 'Pato não voa assim, tá?', 'Ufa. Chão.', 'Da próxima vez, me avisa antes.']));
  }
}
function duckStart() {
  const el = $('#duck');
  if (duckLevel() === 'off') { duckAbort(); el.hidden = true; cancelAnimationFrame(duck.raf); duck.raf = 0; $('#dbub').classList.remove('show'); return; }
  duck.lastPrank = performance.now() - 20000;
  el.hidden = false;
  scheduleTalk(6000);
  if (!duck.raf) { duck.lastT = 0; duck.raf = requestAnimationFrame(duckTick); }
}
// Tocar = cutucar; segurar e arrastar = carregar; soltar arrastando rápido = jogar.
function duckPoke() {
  const now = Date.now();
  duck.taps = duck.taps.filter((x) => now - x < 4000).concat(now);
  if (duck.taps.length >= 3) {
    duckAngry();
    duckSay(duckFresh(['Para de me cutucar!', 'Ei! Vai cutucar tua fatura.', 'Mais um toque e eu conto teus gastos pra todo mundo.',
      'Tá carente? Vai ver teu extrato.', 'Para! Eu bico, hein.']));
  } else duckSay();
}
$('#duck').addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.dhit')) return;
  try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* segue sem captura */ }
  duck.drag = { id: e.pointerId, cx: e.clientX, cy: e.clientY, x0: duck.x, y0: duck.y, moved: false, samples: [[e.clientX, e.clientY, performance.now()]] };
});
$('#duck').addEventListener('pointermove', (e) => {
  const d = duck.drag;
  if (!d || d.id !== e.pointerId) return;
  if (!d.moved && Math.hypot(e.clientX - d.cx, e.clientY - d.cy) > 8) {
    d.moved = true;
    duckAbort(); // largou o que estava fazendo
    duck.state = 'drag'; duck.rot = 0; duck.dirI = 4;
    $('#duck').classList.add('drag');
    duckSay(duckFresh(['Ei! Me solta!', 'Pra onde você tá me levando?', 'Sequestro de pato! Socorro!', 'Me larga, eu tenho contas pra cobrar!']));
  }
  if (!d.moved) return;
  const b = duckBounds();
  duck.x = Math.max(10, Math.min(b.W - 10, d.x0 + (e.clientX - d.cx)));
  duck.y = Math.max(b.topB + 50, Math.min(window.innerHeight - 10, d.y0 + (e.clientY - d.cy)));
  d.samples.push([e.clientX, e.clientY, performance.now()]);
  if (d.samples.length > 6) d.samples.shift();
});
function duckRelease(e) {
  const d = duck.drag;
  if (!d || d.id !== e.pointerId) return;
  duck.drag = null;
  $('#duck').classList.remove('drag');
  if (!d.moved) { if (duck.dropFn) duck.dropFn(); else duckPoke(); return; }
  // velocidade do arraste (px/s) a partir dos últimos movimentos do dedo
  const a = d.samples[0], z = d.samples[d.samples.length - 1], dtS = Math.max(0.016, (z[2] - a[2]) / 1000);
  duck.vx = (z[0] - a[0]) / dtS;
  duck.vy = (z[1] - a[1]) / dtS;
  duck.throwSpeed = Math.hypot(duck.vx, duck.vy);
  duck.state = 'fly';
}
$('#duck').addEventListener('pointerup', duckRelease);
$('#duck').addEventListener('pointercancel', duckRelease);

// Tema: escuro é o padrão. A barra de status do iPhone segue o tema na próxima abertura do app.
function applyTheme() {
  const light = S.theme === 'light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  document.querySelector('meta[name="theme-color"]').content = light ? '#faf8f2' : '#000000';
  document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = light ? 'default' : 'black-translucent';
}

applyTheme();
render();
duckStart();
// Voltou de um recarregamento pedido pelo 🎤: reabre a janela de voz já ouvindo.
try {
  if (sessionStorage.getItem('autoVoice')) { sessionStorage.removeItem('autoVoice'); setTimeout(() => openInv('voice'), 350); }
} catch (e) {}
refreshCdi();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !wrap.hidden) return; // não atrapalha um lançamento sendo digitado
  render();
  refreshCdi();
});
// Botão "Buscar atualização": só com internet (sem ela, apagar o cache deixaria o app sem abrir offline).
// Apaga a cópia do código guardada (os dados ficam no localStorage, não são tocados) e recarrega.
async function forceUpdate() {
  toast('Buscando atualização…');
  try {
    const r = await fetch('sw.js?check=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('offline');
  } catch (e) { toast('Sem internet: tente de novo quando estiver conectado'); return; }
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) { /* segue para recarregar mesmo assim */ }
  location.reload();
}

// Atualização: procura versão nova ao abrir e ao voltar para o app; quando o service worker
// novo assume, recarrega sozinho uma vez (não precisa abrir duas vezes).
// No PC (localhost) não usa service worker: sempre carrega os arquivos novos e funciona até no
// navegador do Claude, onde o service worker não consegue buscar nada na rede.
const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
if (isLocal && 'serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
  fetch('sw.js', { cache: 'no-store' }).then((r) => r.text()).then((t) => {
    const m = t.match(/VERSION = '([^']+)'/);
    if (m) { ui.appVersion = m[1] + ' (PC)'; if (ui.tab === 'cfg') render(); }
  }).catch(() => {});
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !isLocal) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded || !wrap.hidden) return; // não recarrega no meio de um lançamento
    reloaded = true;
    location.reload();
  });
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && e.data.version) { ui.appVersion = e.data.version; if (ui.tab === 'cfg') render(); }
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
    navigator.serviceWorker.ready.then((reg) => reg.active && reg.active.postMessage('version'));
  });
}
})();
</script>
