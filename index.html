<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duck">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Duck</title>
<style>
/* Tema "Duck" (padrão): preto liso com amarelo-pato, minimalista.
   Modo claro (Ajustes): <html data-theme="light">, creme bem claro; títulos em cinza-escuro com um ponto amarelo,
   aba ativa em círculo preto com ícone amarelo. */
:root{
  color-scheme:dark;
  --bg:#000000; --card:#0e0e0e; --text:#f4f4f1; --muted:#8a8a86; --line:#202020;
  --brand:#ffc933; --brand-2:#ffd75e; --in:#4ade80; --out:#ff7a70; --chip:#181818;
  --gold:#ffc933; --acc-rgb:255,201,51; --on-acc:#111111;
  --shadow:none;
  --bar:rgba(0,0,0,.86); --seg-on:#2a2a2a; --toast:#1a1a1a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --head:56px; --tabs:58px;
  --side:max(16px,calc(50% - 304px)); --float:calc(var(--sab) * .55 + 12px); /* barra flutuante de baixo */
  --label:var(--brand); --label-top:var(--brand-2); --top-ic:var(--brand); --dot:none; /* títulos e ponto amarelo antes deles */
  --tab-on:var(--seg-on); --tab-on-ic:var(--brand-2); /* aba ativa */
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#faf8f2; --card:#ffffff; --text:#141414; --muted:#74746f; --line:#ebe7dc;
  --brand:#2b2a26; --brand-2:#2b2a26; --in:#16a34a; --out:#c0392b; --chip:#f2efe6; /* destaques em texto: cinza-escuro */
  --gold:#ffc933; --acc-rgb:230,170,0; --on-acc:#111111;
  --shadow:none;
  --bar:rgba(250,248,242,.9); --seg-on:#ffffff; --toast:#1f1f1f;
  --label:#2b2a26; --label-top:#2b2a26; --top-ic:#2b2a26; --dot:inline-block;
  --tab-on:#141414; --tab-on-ic:#ffc933;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  min-height:100vh;min-height:100dvh;touch-action:manipulation;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--text);font-size:16px}
.num{font-variant-numeric:tabular-nums}

/* ícones (estilo SF Symbols) */
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
.i .k{stroke:var(--knock,var(--bg))}
.i rect.k,.i circle.k{fill:var(--knock,var(--bg))}
.i.sm{width:1.05em;height:1.05em;vertical-align:-.17em;stroke-width:2.2}
.i.big{width:44px;height:44px;stroke-width:1.6;color:var(--muted)}
#tabs{--knock:var(--bg)}
#tabs .i.f{display:none}
#tabs button.on .i.o{display:none}
#tabs .i.o,#tabs button.on .i.f{display:block}

/* topo */
#top{position:fixed;inset:0 0 auto 0;z-index:20;padding-top:var(--sat);
  background:var(--bar);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
#top .bar{height:var(--head);max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
#top .ic{width:44px;height:44px;border-radius:12px;font-size:28px;line-height:1;color:var(--top-ic);display:grid;place-items:center}
#top .ic:active{background:rgba(255,255,255,.08)}
#mlabel,#title{font-size:13px;font-weight:650;letter-spacing:1px;text-transform:uppercase;color:var(--label-top);padding:8px 12px;border-radius:10px}
#title{display:none;margin:0 auto}
#monthNav{display:contents}
#top.cfg #monthNav{display:none}
#top.cfg #title{display:block}

/* conteúdo */
main{max-width:640px;margin:0 auto;
  padding:calc(var(--sat) + var(--head) + 14px) 16px calc(var(--sab) + var(--tabs) + 96px)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:11px;font-weight:650;color:var(--label);text-transform:uppercase;letter-spacing:1px}
.card h2::before,.s-lbl::before,.ih span::before{content:"";display:var(--dot);width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px}
.in{color:var(--in)} .out{color:var(--out)}

/* saldo do mês no topo do Resumo */
.saldo{padding:10px 4px 18px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.s-lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--label)}
.s-big{font-size:40px;font-weight:650;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:4px 0 16px}
.s-big.neg{color:var(--out)}
.s-big.pos{color:var(--in)}
.s-row{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:8px}
.s-row small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.s-row b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.s-grid>div{background:var(--chip);border-radius:12px;padding:10px 12px}
.s-grid small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.s-grid b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:360px){.s-big{font-size:34px}.s-row b,.s-grid b{font-size:13px}}

.cr{margin-bottom:12px}.cr:last-child{margin-bottom:0}
.ch{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:6px}
.ch .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .cv{font-weight:650;font-variant-numeric:tabular-nums}
.ch .cp{width:38px;text-align:right;color:var(--muted);font-size:13px}
.track{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}

.chart{display:flex;gap:6px;align-items:flex-end}
.mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border-radius:10px}
.mb.sel{background:var(--chip)}
.mb .pair{height:96px;display:flex;align-items:flex-end;gap:3px}
.mb .pair i{display:block;width:12px;border-radius:4px 4px 0 0;min-height:0}
.mb .bi{background:var(--in)} .mb .bo{background:var(--out)}
.mb em{font-style:normal;font-size:12px;color:var(--muted);text-transform:capitalize}
.legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--in)}
.legend span.o::before{background:var(--out)}

.tip{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--brand-2)}
.tip.warn{border-left-color:#d97706}
.tip p{margin:0;flex:1}
.tip button{color:var(--brand);font-weight:650;padding:4px 6px}
@media (prefers-color-scheme:dark){.tip button{color:var(--brand-2)}}

.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty big{display:block;font-size:42px;margin-bottom:6px}

/* lista */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;-webkit-appearance:none;appearance:none}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.card,.group,.tip{border:1px solid var(--line)}
.seg.type button.on[data-type=out]{color:var(--out)}
.seg.type button.on[data-type=in]{color:var(--in)}
.day{display:flex;justify-content:space-between;font-size:13px;font-weight:650;color:var(--muted);margin:16px 4px 6px}
.group{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--chip)}
.em{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.em .i{width:22px;height:22px}
.pay .pe .i{width:21px;height:21px;color:var(--muted)}
.ch .i{width:18px;height:18px;color:var(--muted)}
.cat .i{width:16px;height:16px;color:var(--muted)}
.tog .i{color:var(--brand)}
.seg .i{width:17px;height:17px;margin-right:5px;vertical-align:-3px}
.empty .i.big{display:block;margin:0 auto 8px}
#top .ic .i{width:24px;height:24px}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--muted);font-size:13px}
.am{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ajustes */
.btn{display:block;width:100%;text-align:left;padding:13px 4px;border-top:1px solid var(--line);font-weight:550}
.btn:first-of-type{border-top:0}
.btn small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.btn.danger{color:var(--out)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.cat{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:6px 6px 6px 12px;font-size:14px}
.cat button{width:24px;height:24px;border-radius:99px;color:var(--muted);font-size:16px;line-height:1}
.cat button:active{background:var(--line)}
.sub{font-size:12px;font-weight:650;color:var(--muted);margin:12px 0 8px}
.newcat{display:grid;grid-template-columns:56px 1fr;gap:8px;margin-top:12px}
.newcat input,.newcat select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;min-width:0}
.newcat input.e{text-align:center;font-size:20px;padding:0}
.newcat .full{grid-column:1/-1}
.pbtn{height:46px;border-radius:12px;background:var(--gold);color:var(--on-acc);font-weight:700;letter-spacing:.3px}
.note{font-size:13px;color:var(--muted);margin:0}

/* investimentos */
.ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ih span{font-size:11px;font-weight:650;color:var(--label);text-transform:uppercase;letter-spacing:1px}
.lnk{color:var(--brand-2);font-size:14px;font-weight:600;padding:6px 0}
.lnk.full{display:block;width:100%;text-align:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--chip)}
.fc{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.fc div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px;color:var(--muted)}
.fc b{color:var(--text);font-variant-numeric:tabular-nums}
.fc small{color:var(--in);font-size:12px;margin-left:6px}
.ibtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ibtns button{height:44px;border-radius:12px;background:var(--chip);font-size:13px;font-weight:650;color:var(--brand-2)}
.ibtns button:first-child{background:var(--gold);color:var(--on-acc)}
.hist{margin-top:12px}
.hr{padding:8px 0;border-top:1px solid var(--line)}
.hr:first-child{border-top:0}
.hr .ht{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.hr .ht b{font-variant-numeric:tabular-nums}
.hr .hs{font-size:12px;color:var(--muted);margin-top:4px}
.hbar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;position:relative}
.hbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--gold)}
.hbar i.ghost{background:rgba(var(--acc-rgb),.28)}
.flbl{display:block;font-size:12px;font-weight:650;color:var(--muted);margin:10px 0 4px}
.flbl .fld{margin:4px 0 0;font-weight:400}
.evs{margin-top:12px}
.ev{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ev span{flex:1}
.ev button{width:28px;height:28px;border-radius:99px;color:var(--muted);font-size:18px}

.frow{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);font-size:14px;text-transform:capitalize}
.frow b{font-variant-numeric:tabular-nums;color:var(--out);font-weight:600}

/* previsão: gráfico de linha arrastável */
.pchart{overflow-x:auto;margin:0 -16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x mandatory}
.pchart::-webkit-scrollbar{display:none}
.ptrack{display:flex;width:max-content}
.psp{flex:none}
.pin{position:relative;flex:none}
.ptabs button{scroll-snap-align:center}
.psvg{display:block}
.parea{fill:rgba(var(--acc-rgb),.14)}
.pline{fill:none;stroke:var(--brand);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.pv{stroke:rgba(var(--acc-rgb),.25);stroke-width:1}
.pzero{stroke:var(--out);stroke-width:1;stroke-dasharray:4 4;opacity:.5}
.pdot{fill:var(--brand)}
.pdot.neg{fill:var(--out)}
.pdot.pos{fill:var(--in)}
.plbl{position:absolute;transform:translate(-50%,-100%);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px;
  font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.plbl::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--card);border-bottom:0}
.plbl.sel{font-size:16px;font-weight:750;color:var(--text);padding:7px 13px;z-index:2;border-color:rgba(var(--acc-rgb),.5)}
.plbl.neg{color:var(--out)}
.plbl.pos{color:var(--in)}
.ptit{position:absolute;transform:translate(-50%,-100%);font-size:12px;color:var(--muted);white-space:nowrap}
.phit{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%}
.ptabs{display:flex;border-bottom:1px solid var(--line)}
.ptabs button{flex:none;padding:12px 0 10px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.ptabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:650}
.psum>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:15px}
.psum b{font-variant-numeric:tabular-nums}
.psum .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font-size:17px;font-weight:700}
.psum .sub2{font-size:13px;color:var(--muted)}
.psum .sub2 b{color:var(--text);font-weight:600}
.psum .sub2 b.in{color:var(--in)}
.psum .sub2 b.out{color:var(--out)}
.xrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line)}
.xrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.xrow .tx b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xrow .tx small{color:var(--muted);font-size:12px}
.xrow .em{width:34px;height:34px;font-size:17px}
.xrow .em .i{width:19px;height:19px}
.xrow .am{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.xcard{margin:6px 0;padding:4px 12px;border-radius:12px;background:var(--chip)}
.xcard .xch{display:flex;justify-content:space-between;padding:8px 0;font-weight:650;font-size:14px}
.xcard .xrow .em{background:transparent!important}

/* pato que anda pela tela toda e enche o saco. #duck é um ponto (os pés); o desenho fica em volta dele.
   Pranchas de 8 direções (linhas N, NE, E, SE, S, SW, W, NW), quadros de 128 px mostrados em 92 px, pé no ponto 46,66.5:
   pato8-andar.webp (16 quadros), pato8-fugir.webp (12, com a nota no bico), pato8-pegar.webp (15, pegando a nota, só SW).
   De frente (falando): pato-frente.webp, 6 poses x 4 quadros de 52x49. O quadro é escolhido no duckTick. */
#duck{position:fixed;left:0;top:0;width:0;height:0;z-index:14;will-change:transform;pointer-events:none;-webkit-user-select:none;user-select:none}
#duck.drag{z-index:16}
#dsprite{position:absolute;left:-46px;top:-66.5px;width:92px;height:92px;transform-origin:46px 66.5px}
.dbody{width:92px;height:92px}
.dfr{width:92px;height:92px;background:url(pato8-andar.webp) 0 0/1472px 736px no-repeat}
#duck.run .dfr{background-image:url(pato8-fugir.webp);background-size:1104px 736px}
#duck.grab .dfr{background-image:url(pato8-pegar.webp);background-size:736px 184px}
#duck.front .dfr{width:52px;height:49px;margin:19.5px 0 0 20px;background-image:url(pato-frente.webp);background-size:208px 294px}
#duck.angry .dfr{filter:saturate(1.5) hue-rotate(-14deg) brightness(.95)}
#duck.angry .dbody{animation:dshake .12s linear 6}
#duck.peck .dbody{animation:dpeck .5s ease-in-out 2}
#duck.tap .dbody{animation:dtap .45s ease-in-out infinite}
#duck.tumble .dbody{animation:dtumble .75s ease-in-out}
.dbody{transform-origin:46px 66.5px}
@keyframes dtap{0%,100%{transform:none}50%{transform:translateY(-3px)}}
@keyframes dtumble{0%,100%{transform:none}20%{transform:rotate(-24deg)}45%{transform:rotate(16deg)}70%{transform:rotate(-8deg)}}
#dmark{position:fixed;left:0;top:0;z-index:13;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid var(--brand);
  pointer-events:none;animation:dmark 1s ease-out infinite}
@keyframes dmark{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.3);opacity:0}}
/* segurar o dedo na tela chama o pato: sem menu de copiar/selecionar texto (campos continuam editáveis) */
main{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
main input,main select,main textarea{-webkit-user-select:text;user-select:text}
@keyframes dshake{0%,100%{transform:translateX(0)}50%{transform:translateX(1.2px)}}
@keyframes dpeck{0%,100%{transform:none}45%{transform:translate(var(--pk,-4px),2px)}}
.dhit{position:absolute;left:-28px;top:-54px;width:56px;height:60px;pointer-events:auto;cursor:grab;touch-action:none}
#duck.drag .dhit{cursor:grabbing}
#dnota{position:fixed;left:0;top:0;z-index:13;width:17px;height:11px;margin:-5.5px 0 0 -8.5px;background:url(pato8-nota.webp) 0 0/100% 100% no-repeat;
  pointer-events:none;transition:opacity .35s,transform .35s}
#dnota.pop{animation:dpop .35s ease-out}
@keyframes dpop{0%{opacity:0;transform:translateY(-14px) scale(.4)}100%{opacity:1}}
.pay.fake .box{background:var(--gold);border-color:transparent}
.pay.fake .box::after{content:"✓"}
.pay.fake .tx b,.pay.fake .am{color:var(--muted);text-decoration:line-through}
.dbub{position:absolute;bottom:62px;left:0;width:max-content;max-width:min(260px,calc(100vw - 32px));background:var(--card);color:var(--text);
  border:1px solid rgba(var(--acc-rgb),.55);border-radius:14px;padding:8px 12px;font-size:13.5px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.3);
  opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
.dbub.show{opacity:1;transform:none}
.dbub.below{bottom:auto;top:16px}

/* contas do mês */
.paysum{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.paysum b{color:var(--text);font-variant-numeric:tabular-nums}
.pay{display:flex;align-items:center;gap:10px;width:100%;padding:3px 0;border-top:1px solid var(--line)}
.pay .pbody{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 0}
.pay .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--on-acc);
  margin:8px 0;box-shadow:0 0 0 10px transparent}
.paydet{margin:0 0 8px 34px;padding:6px 12px;border-radius:12px;background:var(--chip)}
.paydet>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.paydet>div:first-child{border-top:0}
.paydet span{min-width:0}
.paydet small{display:block;color:var(--muted);font-size:12px}
.paydet b{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.paydet .lnk{display:block;margin-top:2px}
.pay.on .box{background:var(--gold);border-color:transparent}
.pay .pe{font-size:18px;flex:none}
.pay .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.pay .tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .tx small{color:var(--muted);font-size:12px}
.pay .am{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--out)}
.pay.on .tx b,.pay.on .am{color:var(--muted);text-decoration:line-through}

/* botão + e abas */
#fab{position:fixed;right:var(--side);bottom:var(--float);z-index:15;
  width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--on-acc);
  box-shadow:0 6px 22px rgba(var(--acc-rgb),.35);display:grid;place-items:center}
#fab:active{transform:scale(.94)}
#fab.carried{pointer-events:none;box-shadow:none}
#fab svg{width:28px;height:28px}
#fab.hide,#mic.hide{display:none}
/* microfone: menor, empilhado em cima do + */
#mic{position:fixed;right:calc(var(--side) + 7px);bottom:calc(var(--float) + 70px);z-index:15;
  width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--brand);border:1px solid rgba(var(--acc-rgb),.45);
  box-shadow:0 4px 14px rgba(0,0,0,.35);display:grid;place-items:center}
#mic:active{transform:scale(.94)}
#mic svg{width:22px;height:22px}
.vwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 4px;text-align:center}
.vmic{width:84px;height:84px;border-radius:50%;background:var(--gold);color:var(--on-acc);display:grid;place-items:center;
  box-shadow:0 6px 22px rgba(var(--acc-rgb),.35)}
.vmic svg{width:38px;height:38px}
.vmic.on{animation:vpulse 1.2s ease-in-out infinite}
.vdiag{font-size:11px;color:var(--muted);opacity:.7;margin:-6px 0 0;min-height:14px}
#vText.hl{border-color:var(--brand);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.25)}
@keyframes vpulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.55)}50%{box-shadow:0 0 0 16px rgba(var(--acc-rgb),0)}}
/* abas: pílula flutuante só com ícones (o nome fica para leitores de tela); a ativa ganha um círculo. O + fica ao lado. */
#tabs{position:fixed;left:var(--side);right:calc(var(--side) + 68px);bottom:var(--float);z-index:15;height:var(--tabs);padding:5px;
  background:var(--bar);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);transition:right .2s}
#tabs.wide{right:var(--side)}
#tabs .in-{display:grid;grid-template-columns:repeat(5,1fr);height:100%}
#tabs button{justify-self:center;align-self:center;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0;line-height:0;color:var(--muted);transition:background .15s}
#tabs button.on{color:var(--tab-on-ic);background:var(--tab-on);--knock:var(--tab-on)}
#tabs .i{width:25px;height:25px}

/* folha de lançamento */
.wrap{position:fixed;inset:0;z-index:40}
.wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--card);
  border-radius:22px 22px 0 0;padding:10px 16px calc(var(--sab) + 18px);max-height:94vh;max-height:94dvh;overflow:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.wrap.open .backdrop{opacity:1}
.wrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:17px;text-align:center}
.amount{display:flex;align-items:center;gap:8px;margin:14px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount span{font-size:22px;color:var(--muted);font-weight:600}
.amount input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.amount:focus-within{border-color:var(--brand-2)}
.fld{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;margin-bottom:10px;-webkit-appearance:none;appearance:none}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:14px;background:var(--chip);font-size:12px;border:2px solid transparent;text-align:center;min-width:0}
.chip span{font-size:22px;display:grid;place-items:center;height:28px}
.chip .i{width:24px;height:24px}
.chip em{font-style:normal;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{border-color:var(--brand-2);background:color-mix(in srgb,var(--brand-2) 16%,var(--card));--knock:color-mix(in srgb,var(--brand-2) 16%,var(--card))}
.chip.on .i{color:var(--brand-2)}
.two-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two-f label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:4px}
.two-f .opt{font-weight:400}
.two-f label .fld{margin:4px 0 10px;font-weight:400;color:var(--text);text-transform:none}
.acts{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.acts .pbtn{flex:1;min-width:120px}
.acts .sbtn{height:46px;padding:0 14px;border-radius:12px;background:var(--chip);color:var(--out);font-weight:600;font-size:14px}

.link{margin:0 0 12px}
.tog{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--chip);font-weight:600;font-size:15px;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}
.link .fld{margin:8px 0 0}
.bill{display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.bill:first-of-type{border-top:0;padding-top:0}
.bh{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.bh b{font-variant-numeric:tabular-nums}
.bh b.ask{color:var(--brand)}
@media (prefers-color-scheme:dark){.bh b.ask{color:var(--brand-2)}}
.bs{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.warnc{color:#d97706}
.badge{font-size:11px;font-weight:650;color:var(--brand);background:color-mix(in srgb,var(--brand-2) 20%,transparent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
@media (prefers-color-scheme:dark){.badge{color:var(--brand-2)}}

.xclose{position:absolute;top:8px;right:10px;width:36px;height:36px;border-radius:50%;background:var(--chip);color:var(--muted);
  font-size:20px;line-height:1;display:grid;place-items:center;z-index:2}
.sheet.drag{transition:none!important}

/* confirmação: cartão no meio da tela, por cima de tudo */
#wrapC .backdrop{background:rgba(0,0,0,.7)}
#wrapC .sheet{top:50%;bottom:auto;left:16px;right:16px;max-width:400px;border-radius:20px;padding:22px 18px 18px;
  border:1px solid rgba(var(--acc-rgb),.35);box-shadow:0 20px 50px rgba(0,0,0,.8);
  transform:translateY(-50%) scale(.92);opacity:0;transition:transform .2s,opacity .2s}
#wrapC.open .sheet{transform:translateY(-50%);opacity:1}
#wrapC .grab{display:none}

#toast{border:1px solid rgba(var(--acc-rgb),.4);position:fixed;left:50%;bottom:calc(var(--float) + var(--tabs) + 14px);transform:translate(-50%,20px);z-index:60;
  background:var(--toast);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:550;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Tema claro: amarelo-pato só onde não precisa ser lido (fundos, linhas, sublinhados); texto e ícones em cinza-escuro. */
:root[data-theme="light"] .lnk{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:4px}
:root[data-theme="light"] .lnk.full{text-decoration:none}
:root[data-theme="light"] .chip.on{border-color:var(--gold);background:#fff4d1;--knock:#fff4d1}
:root[data-theme="light"] .pline{stroke:var(--gold)}
:root[data-theme="light"] .pdot{fill:var(--gold)}
:root[data-theme="light"] .ptabs button.on{border-bottom-color:var(--gold)}
:root[data-theme="light"] .badge{background:#ffeaa6}
:root[data-theme="light"] .amount:focus-within{border-color:var(--gold)}
:root[data-theme="light"] .plbl.sel{border-color:var(--gold)}
</style>
</head>
<body>

<header id="top">
  <div class="bar">
    <div id="monthNav">
      <button class="ic" id="prev" aria-label="Mês anterior"><i data-ic="left"></i></button>
      <button id="mlabel" aria-label="Voltar para o mês atual"></button>
      <button class="ic" id="next" aria-label="Próximo mês"><i data-ic="right"></i></button>
    </div>
    <div id="title">Ajustes</div>
  </div>
</header>

<main id="view"></main>

<button id="mic" aria-label="Lançar por voz">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
</button>
<button id="fab" aria-label="Novo lançamento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div id="duck" hidden aria-label="Pato">
  <div class="dbub" id="dbub" role="status"></div>
  <div id="dsprite" aria-hidden="true"><div class="dbody"><div class="dfr"></div></div></div>
  <div class="dhit"></div>
</div>
<div id="dnota" hidden></div>
<div id="dmark" hidden></div>

<nav id="tabs">
  <div class="in-">
    <button data-tab="sum" class="on"><i data-ic="chart"></i>Resumo</button>
    <button data-tab="list"><i data-ic="list"></i>Lançamentos</button>
    <button data-tab="prev"><i data-ic="cal"></i>Previsão</button>
    <button data-tab="inv"><i data-ic="trend"></i>Investir</button>
    <button data-tab="cfg"><i data-ic="gear"></i>Ajustes</button>
  </div>
</nav>

<div class="wrap" id="wrap" hidden>
  <div class="backdrop" id="backdrop"></div>
  <form class="sheet" id="sheet" autocomplete="off" novalidate>
    <div class="grab"></div>
    <h3 id="sheetTitle">Novo lançamento</h3>
    <div class="seg type" id="typeSeg">
      <button type="button" data-type="out" class="on">Despesa</button>
      <button type="button" data-type="in">Receita</button>
    </div>
    <label class="amount"><span>R$</span><input id="fAmount" inputmode="decimal" placeholder="0,00" aria-label="Valor"></label>
    <input class="fld" id="fDesc" placeholder="Descrição (opcional)" maxlength="60">
    <div class="chips" id="fCats"></div>
    <div class="link" id="cardWrap">
      <label class="tog"><input type="checkbox" id="fCard"><span><i data-ic="card" class="sm"></i> Vinculado ao cartão</span></label>
      <select class="fld" id="fCardSel" hidden aria-label="Cartão"></select>
    </div>
    <div class="link">
      <label class="tog"><input type="checkbox" id="fFix"><span><i data-ic="repeat" class="sm"></i> <span id="fFixTxt">Gasto fixo (repete todo mês)</span></span></label>
      <div class="two-f" id="fixOpts" hidden style="margin-top:8px">
        <label>Por quantos meses?<input class="fld" type="number" id="fMonths" min="2" max="360" inputmode="numeric" placeholder="Sem fim"></label>
        <label>Termina em<input class="fld" type="month" id="fEnd"></label>
      </div>
      <p class="note" id="fixHint" hidden style="margin-top:2px">Preencha um dos dois (o outro se ajusta). Em branco = todo mês, sem data para acabar.</p>
      <p class="note" id="fixNote" hidden style="margin-top:8px">Alterações neste gasto fixo valem deste mês em diante.</p>
    </div>
    <div class="two-f">
      <label>Data<input class="fld" type="date" id="fDate"></label>
      <label id="fDueWrap">Vencimento <span class="opt">(opcional)</span><input class="fld" type="date" id="fDue"></label>
    </div>
    <div class="acts">
      <button type="button" class="sbtn" id="btnDel" hidden>Excluir</button>
      <button type="button" class="sbtn" id="btnDelNext" hidden>Excluir este e os próximos</button>
      <button type="submit" class="pbtn">Salvar</button>
    </div>
  </form>
</div>

<div class="wrap" id="wrap2" hidden>
  <div class="backdrop"></div>
  <form class="sheet" id="sheet2" autocomplete="off" novalidate>
    <div class="grab"></div>
    <h3 id="billTitle">Fatura do cartão</h3>
    <p class="note" id="billInfo"></p>
    <label class="amount"><span>R$</span><input id="bAmount" inputmode="decimal" placeholder="0,00" aria-label="Total da fatura"></label>
    <div class="acts">
      <button type="button" class="sbtn" id="bDel">Remover fatura</button>
      <button type="submit" class="pbtn">Salvar fatura</button>
    </div>
  </form>
</div>

<div class="wrap" id="wrap3" hidden>
  <div class="backdrop"></div>
  <form class="sheet" id="sheet3" autocomplete="off" novalidate>
    <div class="grab"></div>
    <h3 id="iTitle"></h3>
    <div id="iBody"></div>
    <div class="acts" style="margin-top:14px">
      <button type="button" class="sbtn" id="iDel" hidden>Excluir investimento</button>
      <button type="submit" class="pbtn">Salvar</button>
    </div>
  </form>
</div>

<div class="wrap" id="wrapC" hidden style="z-index:50">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="grab"></div>
    <p id="cMsg" style="margin:6px 4px 18px;font-size:16px;text-align:center;line-height:1.45"></p>
    <div class="acts">
      <button type="button" class="sbtn" id="cNo" style="flex:1;color:var(--text)">Cancelar</button>
      <button type="button" class="pbtn" id="cYes">Confirmar</button>
    </div>
  </div>
</div>

<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- dados ---------- */
const KEY = 'financas.v1';
const PALETTE = ['#ffc933','#a8a29e','#e2c78f','#8d99ae','#b08d57','#d8d4cc','#9c8f7a','#c0c0c0','#7f8c8d','#a67c52'];
const DEF_OUT = [['mercado','Mercado','🛒'],['moradia','Moradia','🏠'],['transporte','Transporte','🚗'],['restaurantes','Restaurantes','🍔'],
  ['saude','Saúde','💊'],['lazer','Lazer','🎮'],['contas','Contas','💡'],['compras','Compras','🛍️'],['combustivel','Combustível','⛽'],['outros','Outros','📦']];
const FUEL = 'combustivel';
const DEF_IN = [['salario','Salário','💼'],['extra','Extra','💰'],['outros-in','Outros','📥']];

function defaults() {
  let k = 0;
  const mk = (type) => ([id, name, emoji]) => ({ id, name, emoji, type, color: PALETTE[k++ % PALETTE.length] });
  return { v: 1, tx: [], cats: [...DEF_OUT.map(mk('out')), ...DEF_IN.map(mk('in'))],
    cards: [{ id: 'card1', name: 'Cartão de crédito' }], bills: {}, fixed: [], inv: [], cdi: 13.9, cdiV2: true, lastBackup: null, tipOff: false };
}
// Dados antigos (sem cartões) ganham os campos novos.
function migrate(s) {
  if (!Array.isArray(s.cards)) s.cards = [{ id: 'card1', name: 'Cartão de crédito' }];
  if (!s.bills || typeof s.bills !== 'object' || Array.isArray(s.bills)) s.bills = {};
  if (!Number.isFinite(s.cdi)) s.cdi = 13.9;
  if (!s.cdiV2) { if (s.cdi === 14.9) s.cdi = 13.9; s.cdiV2 = true; } // o padrão antigo (14,9%) estava acima do CDI real
  if (!Array.isArray(s.inv)) s.inv = [];
  s.inv = s.inv.filter((v) => v && v.id && Array.isArray(v.events));
  for (const v of s.inv) {
    if (!Number.isFinite(v.pct)) v.pct = 100;
    v.events = v.events.filter((e) => e && Number.isFinite(e.amount) && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && ['set', 'in', 'out'].includes(e.type));
  }
  if (!s.cats.some((c) => c.id === 'combustivel')) s.cats.push({ id: 'combustivel', name: 'Combustível', emoji: '⛽', type: 'out', color: '#b08d57' });
  if (!Array.isArray(s.fixed)) s.fixed = [];
  s.fixed = s.fixed.filter((r) => r && r.id && Number.isFinite(r.amount) && /^\d{4}-\d{2}-\d{2}$/.test(r.start) && (r.type === 'in' || r.type === 'out'));
  for (const r of s.fixed) { if (!Array.isArray(r.skip)) r.skip = []; if (!Number.isFinite(r.k0)) r.k0 = 0; }
  return s;
}

let memoryOnly = false;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.tx) && Array.isArray(s.cats)) return migrate(s);
    }
  } catch (e) { /* storage indisponível ou corrompido */ }
  return defaults();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); memoryOnly = false; }
  catch (e) { memoryOnly = true; toast('Não consegui salvar neste navegador!'); }
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

/* ---------- utilidades ---------- */
const $ = (s, e = document) => e.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ---------- ícones (estilo SF Symbols: contorno arredondado; versão cheia quando selecionado) ----------
   o = contorno, f = cheio. Na versão cheia, ".k" é o recorte (pinta com a cor do fundo, var(--knock)). */
const ICONS = {
  chart: { o: '<rect x="3.5" y="12" width="4.5" height="8.5" rx="1.6"/><rect x="9.75" y="4" width="4.5" height="16.5" rx="1.6"/><rect x="16" y="8.5" width="4.5" height="12" rx="1.6"/>',
           f: '<rect x="3.5" y="12" width="4.5" height="8.5" rx="1.6" fill="currentColor"/><rect x="9.75" y="4" width="4.5" height="16.5" rx="1.6" fill="currentColor"/><rect x="16" y="8.5" width="4.5" height="12" rx="1.6" fill="currentColor"/>' },
  list:  { o: '<rect x="4" y="3" width="16" height="18" rx="3.5"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>',
           f: '<rect x="4" y="3" width="16" height="18" rx="3.5" fill="currentColor"/><path class="k" d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>' },
  cal:   { o: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v3.5M16 3v3.5"/>',
           f: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.5" fill="currentColor"/><path class="k" d="M4.3 10h15.4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/><path d="M8 3v3.5M16 3v3.5"/>' },

const isBiz = (d) => { const w = d.getDay(); return w !== 0 && w !== 6 && !holidays(d.getFullYear()).has(iso(d)); };

// Simula o saldo dia a dia até "until". Devolve saldo final e, por mês, rendimento e saldo no fim.
function simulate(v, until) {
  const ev = [...v.events].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const months = {};
  const gross = invRate(v);
  if (!ev.length) return { end: 0, months, total: 0, carry: 0, f: gross };
  const start0 = parseISO(ev[0].date);
  const net = (d) => gross * (1 - (v.ir === false ? 0 : irByDays((d - start0) / 864e5)));
  // Como uma conta: o saldo é em centavos inteiros; a fração do dia fica guardada (carry)
  // e vira um centavo a mais quando completa (por isso dá 0,41, 0,41, 0,42...).
  let bal = 0, total = 0, i = 0, started = false, carry = 0;
  const d = parseISO(ev[0].date), end = parseISO(until);
  for (; d <= end; d.setDate(d.getDate() + 1)) {
    const ds = iso(d), M = months[ds.slice(0, 7)] || (months[ds.slice(0, 7)] = { earn: 0, end: 0 });
    if (started && isBiz(d)) {
      carry += bal * net(d);
      const g = Math.floor(carry + 1e-9);
      carry -= g; bal += g; M.earn += g; total += g;
    }
    while (i < ev.length && ev[i].date === ds) {
      const e = ev[i++];
      if (e.type === 'set') { if (started) { M.earn += e.amount - bal; total += e.amount - bal; } bal = e.amount; carry = 0; }
      else if (e.type === 'in') bal += e.amount;
      else bal = Math.max(0, bal - e.amount);
      started = true;
    }
    M.end = bal;
  }
  return { end: bal, months, total, carry, f: net(end) };
}
// Taxa bruta por dia útil: a medida no banco (eff, já convertida para bruta), se houver; senão, pelo % do CDI.
// A calibrada guarda o CDI da época (effCdi): se o CDI muda, ela acompanha na mesma proporção.
const invRate = (v) => (Number.isFinite(v.eff) && v.eff > 0
  ? v.eff * dayRate(100) / (Math.pow(1 + (v.effCdi || S.cdi) / 100, 1 / 252) - 1)
  : dayRate(v.pct));
const setEff = (v, gross) => { v.eff = gross; v.effCdi = S.cdi; };
// IR regressivo sobre o rendimento. O extrato do Mercado Pago já mostra o valor líquido (com IR descontado).
const irByDays = (days) => (days <= 180 ? 0.225 : days <= 360 ? 0.2 : days <= 720 ? 0.175 : 0.15);
const irAt = (v, ds) => (v.ir === false ? 0 : irByDays((parseISO(ds) - parseISO(firstEvent(v).date)) / 864e5));
const netRate = (v, ds) => invRate(v) * (1 - irAt(v, ds));
const toGross = (v, net, ds) => net / (1 - irAt(v, ds));

const nextCredit = (sim) => Math.floor(sim.carry + sim.end * sim.f + 1e-9);

  for (const v of S.inv) for (const e of v.events) if (test(e.date)) s += e.type === 'in' ? e.amount : e.type === 'out' ? -e.amount : 0;
  return s;
}

function monthTotals(m) {
  const { i, o } = totals(monthTx(m));
  const cards = S.cards.map((c) => cardInfo(c.id, m));
  const extra = cards.reduce((a, x) => a + x.extra, 0);
  return { i, o: o + extra, extra, cards, inv: invFlow((d) => d.startsWith(m)) };
}
function extrasUpTo(m) {
  let s = 0;
  for (const k in S.bills) {
    const [cid, mm] = k.split('|');

/* ---------- estado da interface ---------- */
/* ---------- contas do mês (pago / não pago) ----------
   Cada despesa do mês é um item a pagar. Despesas vinculadas ao cartão viram um item só: a fatura.
   Sem marcação, meses passados contam como pagos e o mês atual/futuros como não pagos. */
const curMonth = () => today().slice(0, 7);
const paidDefault = (v, m) => v === true || (v !== false && m < curMonth());
function paidOf(t, m) {
  if (t.rule) { const r = S.fixed.find((x) => x.id === t.rule); return paidDefault(r && r.pay ? r.pay[m] : undefined, m); }
  // Gasto avulso no débito (sem cartão, não fixo): já saiu da conta quando a data chega.
  if (t.paid === undefined && t.type === 'out' && !cardOf(t.card) && t.date <= today()) return true;
  return paidDefault(t.paid, m);
}
const billPaid = (cid, m) => paidDefault((S.billPay || {})[billKey(cid, m)], m);
function payables(m) {
  const items = [];
  for (const t of monthTx(m)) {
    if (t.type !== 'out' || cardOf(t.card)) continue;
    items.push({ kind: t.rule ? 'rule' : 'tx', id: t.rule || t.id, m, t, amount: t.amount, date: t.date, due: t.due || null, paid: paidOf(t, m) });
  }
  for (const c of S.cards) {
    const x = cardInfo(c.id, m);
    const amount = x.bill != null ? Math.max(x.bill, x.linked) : x.linked;
    if (amount > 0) items.push({ kind: 'bill', id: c.id, m, c, x, amount, date: m + '-99', paid: billPaid(c.id, m) });
  }
  return items;
}
const tomorrow = () => { const d = parseISO(today()); d.setDate(d.getDate() + 1); return iso(d); };
// Texto do vencimento de uma conta: "vence hoje", "vence amanhã", "venceu 10/10" ou "vence 20/10".
function dueInfo(p) {
  if (!p.due) return null;
  const dd = parseISO(p.due).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  if (p.paid) return { txt: `vencia ${dd}`, cls: '' };
  if (p.due < today()) return { txt: `venceu ${dd}`, cls: 'out' };
  if (p.due === today()) return { txt: 'vence hoje', cls: 'warnc' };
  if (p.due === tomorrow()) return { txt: 'vence amanhã', cls: 'warnc' };

}
function togglePay(kind, id, m) {
  if (kind === 'tx') { const t = S.tx.find((x) => x.id === id); if (t) t.paid = !paidOf(t, m); }
  else if (kind === 'rule') { const r = S.fixed.find((x) => x.id === id); if (r) { r.pay = r.pay || {}; r.pay[m] = !paidOf({ rule: id }, m); } }
  else { S.billPay = S.billPay || {}; S.billPay[billKey(id, m)] = !billPaid(id, m); }
  save(); render();
  duckPaid(`${kind}|${id}|${m}`);
}
// Primeiro mês com algum dado (para somar o histórico do saldo em conta).
function firstDataMonth(m) {
  let f = m;
  for (const t of S.tx) if (t.date.slice(0, 7) < f) f = t.date.slice(0, 7);
  for (const r of S.fixed) if (r.start.slice(0, 7) < f) f = r.start.slice(0, 7);
  for (const k in S.bills) { const mm = k.split('|')[1]; if (mm < f) f = mm; }

  </section>`;
}

const moneyR = (c) => money(Math.round(c));
const fmtPct = (n) => n.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '%';

function vInv() {
  const t = today(), cur = t.slice(0, 7), eom = lastDay(t);
  const cdiSrc = S.cdiAuto !== false && S.cdiDate ? ` (Banco Central, ${esc(S.cdiDate)})` : S.cdiAuto === false ? ' (manual)' : '';
  let h = `<p class="note" style="margin:0 0 14px">CDI: <b>${fmtPct(S.cdi)} ao ano</b>${cdiSrc} · rende só em dias úteis · IR descontado pela tabela regressiva, como no extrato do banco.
    <button class="lnk" data-act="inv-cdi" style="padding:0 0 0 4px">CDI ›</button></p>`;
  if (!S.inv.length) {
    h += `<div class="empty">${ico('trend', false, 'big')}Nenhum investimento ainda.<br>Adicione o seu para ver quanto rende por dia e a previsão.</div>`;
  }
  for (const v of S.inv) {
    const hist = simulate(v, t), fim = simulate(v, eom);
    const bal = hist.end, daily = nextCredit(hist);
    const exact = bal * netRate(v, t) / 100; // reais líquidos por dia útil, com fração
    const irTxt = v.ir === false ? 'sem desconto de IR' : `IR de ${fmtPct(irAt(v, t) * 100)} descontado`;
    const calibrated = Number.isFinite(v.eff) && v.eff > 0;
    const left = bizDaysBetween(t, eom);
    const earnedMonth = (hist.months[cur] || {}).earn || 0;
    const m6 = simulate(v, addMonthsISO(t, 6)).end, y1 = simulate(v, addMonthsISO(t, 12)).end;
    h += `<section class="card">
      <div class="ih"><span>${esc(v.name)}</span><button class="lnk" data-act="inv-cfg" data-id="${esc(v.id)}">Ajustar ›</button></div>
      <div class="s-big" style="margin-bottom:12px">${moneyR(bal)}</div>
      <div class="s-row">
        <div><small>Por dia útil</small><b class="in">+ ${moneyR(daily)}</b></div>
        <div><small>Rendeu no mês</small><b class="in">+ ${moneyR(earnedMonth)}</b></div>
        <div><small>Desde ${parseISO(firstEvent(v).date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}</small><b class="in">+ ${moneyR(hist.total)}</b></div>
      </div>
      <p class="note" style="margin-top:10px">${fmtPct(v.pct)} do CDI · ${irTxt} · ${calibrated
        ? `taxa ajustada pelo banco (≈ R$ ${exact.toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 })} por dia útil)`
        : `calculado pelo CDI de ${fmtPct(S.cdi)}. Se não bater com o extrato, toque em Ajustar e digite quanto rendeu no dia.`}</p>
      <div class="fc">
        <div><span>Fim do mês</span><span><b>${moneyR(fim.end)}</b><small>+${moneyR(fim.end - bal)} em ${left} dia${left === 1 ? '' : 's'} úte${left === 1 ? 'il' : 'is'}</small></span></div>
        <div><span>Em 6 meses</span><span><b>${moneyR(m6)}</b><small>+${moneyR(m6 - bal)}</small></span></div>
        <div><span>Em 1 ano</span><span><b>${moneyR(y1)}</b><small>+${moneyR(y1 - bal)}</small></span></div>
      </div>
      <div class="ibtns">
        <button data-act="inv-in" data-id="${esc(v.id)}">Aplicar</button>
        <button data-act="inv-out" data-id="${esc(v.id)}">Resgatar</button>
        <button data-act="inv-set" data-id="${esc(v.id)}">Atualizar saldo</button>
      </div>
      <button class="lnk full" data-act="inv-hist" data-id="${esc(v.id)}">${ui.invOpen === v.id ? 'Esconder rendimento por mês' : 'Ver rendimento por mês'}</button>
      ${ui.invOpen === v.id ? invHist(hist, fim, cur) : ''}
    </section>`;
  }
  h += `<button class="pbtn" style="width:100%" data-act="inv-new">+ ${S.inv.length ? 'Novo investimento' : 'Adicionar investimento'}</button>`;
  return h;
}
function invHist(hist, fim, cur) {
  const keys = Object.keys(hist.months).sort().reverse().slice(0, 12);
  const fc = (fim.months[cur] || {}).earn || 0;
  const max = Math.max(1, fc, ...keys.map((k) => hist.months[k].earn));
  return `<div class="hist">${keys.map((k) => {
    const M = hist.months[k], isCur = k === cur;
    return `<div class="hr"><div class="ht"><span>${esc(monthLabel(k))}${isCur ? ' <span class="note">(até hoje)</span>' : ''}</span><b class="in">+ ${moneyR(M.earn)}</b></div>
      <div class="hbar">${isCur ? `<i class="ghost" style="width:${fc / max * 100}%"></i>` : ''}<i style="width:${Math.max(0, M.earn) / max * 100}%"></i></div>
      <div class="hs">Saldo no fim: ${moneyR(isCur ? fim.months[cur].end : M.end)}${isCur ? ` (previsto) · rendimento previsto no mês: + ${moneyR(fc)}` : ''}</div></div>`;
  }).join('')}</div>`;
}

// Previsão: do mês atual até 11 meses à frente, com gastos fixos, parcelas e lançamentos futuros.
function vPrev() {
  const cur = curMonth();
  const rows = [];
  for (let k = 0; k < 12; k++) {
    const m = shiftMonth(cur, k);
    const tt = monthTotals(m);
    const nFix = monthTx(m).filter((t) => t.rule && t.type === 'out').length;
    rows.push({ m, ...tt, nFix, conta: contaPrevista(m) });
  }
  if (!rows.some((d) => d.i || d.o)) {
    return `<div class="empty">${ico('cal', false, 'big')}Nada previsto ainda.<br>Lance gastos e receitas fixos para ver a previsão dos próximos meses.</div>`;
  }
  if (!rows.some((d) => d.m === ui.prevSel)) ui.prevSel = cur;
  const sel = rows.find((d) => d.m === ui.prevSel);

  // Gráfico de linha: um ponto por mês com quanto sobra (receitas − despesas − aplicações).
  const COL = PCOL, H = 210, padT = 64, padB = 18, W = COL * rows.length;
  const vals = rows.map((d) => d.i - d.o - d.inv);
  let vmin = Math.min(0, ...vals), vmax = Math.max(0, ...vals);
  if (vmax === vmin) vmax = vmin + 100;
  const X = (i) => COL * i + COL / 2;
  const Y = (v) => padT + (vmax - v) / (vmax - vmin) * (H - padT - padB);
  const pts = rows.map((d, i) => [X(i), Y(vals[i])]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = `${line} L ${pts[pts.length - 1][0]} ${H} L ${pts[0][0]} ${H} Z`;
  const zero = vmin < 0 ? `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" class="pzero"/>` : '';
  const signed = (v) => (v < 0 ? '−' : '+') + money(Math.abs(v));
  const shortMonth = (m) => {
    const [y, mm] = m.split('-').map(Number);
    const n = cap(new Date(y, mm - 1, 1).toLocaleDateString('pt-BR', { month: 'long' }));
    return y !== +cur.slice(0, 4) ? `${n} ${String(y).slice(2)}` : n;
  };
  const selIdx = rows.findIndex((d) => d.m === ui.prevSel);
  const chart = `<div class="pchart" id="pchart"><div class="ptrack"><div class="psp"></div><div class="pin" style="width:${W}px">
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="psvg">
      <path d="${area}" class="parea"/>${zero}
      ${pts.map((p, i) => `<line x1="${p[0]}" x2="${p[0]}" y1="${p[1]}" y2="${H}" class="pv"/>`).join('')}
      <path d="${line}" class="pline"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${rows[i].m === ui.prevSel ? 7 : 5.5}" class="pdot ${vals[i] < 0 ? 'neg' : ''}" data-m="${rows[i].m}"/>`).join('')}
    </svg>
    <div class="ptit" id="ptit" style="left:${pts[selIdx][0]}px;top:${pts[selIdx][1] - 54}px">Vai sobrar</div>
    ${rows.map((d, i) => {
      const s = d.m === ui.prevSel;
      return `<button class="plbl ${s ? 'sel' : ''} ${vals[i] < 0 ? 'neg' : ''}" data-act="psel" data-m="${d.m}" style="left:${pts[i][0]}px;top:${pts[i][1] - 12}px">${signed(vals[i])}</button>
        <button class="phit" data-act="psel" data-m="${d.m}" style="left:${pts[i][0]}px;top:${pts[i][1]}px" aria-label="${esc(monthLabel(d.m))}"></button>`;
    }).join('')}
    <div class="ptabs">${rows.map((d) => `<button data-act="psel" data-m="${d.m}" class="${d.m === ui.prevSel ? 'on' : ''}" style="width:${COL}px">${esc(shortMonth(d.m))}</button>`).join('')}</div>
  </div><div class="psp"></div></div></div>`;

  return `<p class="note" style="margin:0 0 6px">Quanto vai sobrar em cada mês (considera que tudo será pago). Arraste para os lados e toque num mês.</p>
    ${chart}${prevDetail(sel)}`;
}

// Extrato do mês escolhido no gráfico: o que entra, o que sai e quanto sobra.
function prevDetail(d) {
  const m = d.m, list = monthTx(m);
  const bal = d.i - d.o - d.inv;
  const dd = (s) => parseISO(s).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const row = (t, sign) => {
    const c = catOf(t.cat);
    return `<button class="xrow" data-act="edit" data-id="${esc(t.id)}"><span class="em" style="background:${c.color}2b">${emo(c.emoji)}</span>
      <span class="tx"><b>${esc(t.desc || c.name)}</b><small>${dd(t.date)} · ${esc(c.name)}${t.rule ? ' · fixo' : ''}</small></span>
      <span class="am ${sign === '+' ? 'in' : 'out'}">${sign} ${money(t.amount)}</span></button>`;
  };
  const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const ins = list.filter((t) => t.type === 'in').sort(byDate);
  const outs = list.filter((t) => t.type === 'out' && !cardOf(t.card)).sort(byDate);
  const cardsHtml = S.cards.map((c) => {
    const x = cardInfo(c.id, m);
    const linked = list.filter((t) => t.type === 'out' && t.card === c.id).sort(byDate);
    const total = x.bill != null ? Math.max(x.bill, x.linked) : x.linked;
    if (!total) return '';
    return `<div class="xcard"><div class="xch"><span>${ico('card', false, 'sm')} Fatura ${esc(c.name)}</span><b class="out">− ${money(total)}</b></div>
      ${linked.map((t) => row(t, '−')).join('')}
      ${x.extra ? `<div class="xrow"><span class="em">${ico('card')}</span><span class="tx"><b>Outros gastos no cartão</b><small>fatura − vinculados</small></span><span class="am out">− ${money(x.extra)}</span></div>` : ''}</div>`;
  }).join('');
  return `<section class="card" id="pdet" style="margin-top:14px">
    <div class="ih"><span>${esc(monthLabel(m))}</span><button class="lnk" data-act="goMonth" data-m="${m}">Abrir no Resumo ›</button></div>
    <div class="psum">
      <div><span>+ Vai receber</span><b class="in">${money(d.i)}</b></div>
      <div><span>− Vai pagar</span><b class="out">${money(d.o)}</b></div>
      ${d.inv ? `<div><span>${d.inv > 0 ? '− Para investimentos' : '+ Resgates'}</span><b>${money(Math.abs(d.inv))}</b></div>` : ''}
      <div class="tot"><span>= Vai sobrar</span><b class="${neg0(bal)}">${signedMoney(bal)}</b></div>
      <div class="sub2"><span>Saldo em conta no fim do mês</span><b class="${neg0(d.conta)}">${money(d.conta)}</b></div>
    </div>
    ${ins.length ? `<div class="sub">Entradas</div>${ins.map((t) => row(t, '+')).join('')}` : ''}
    ${outs.length || cardsHtml ? `<div class="sub">Saídas</div>${outs.map((t) => row(t, '−')).join('')}${cardsHtml}` : ''}
    ${!ins.length && !outs.length && !cardsHtml ? '<p class="note">Nada lançado para este mês.</p>' : ''}
  </section>`;
}
const signedMoney = (v) => (v < 0 ? '−' : '+') + money(Math.abs(v));
const PCOL = 110; // largura de cada mês no gráfico da previsão
const prevRow = (m) => ({ m, ...monthTotals(m), conta: contaPrevista(m) });
// Troca o mês selecionado sem redesenhar o gráfico (para não atrapalhar o arraste).
function selectPrev(m) {
  if (!m || ui.prevSel === m) return;
  ui.prevSel = m;
  document.querySelectorAll('#pchart .plbl').forEach((b) => b.classList.toggle('sel', b.dataset.m === m));
  document.querySelectorAll('#pchart .ptabs button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
  document.querySelectorAll('#pchart .pdot').forEach((c) => c.setAttribute('r', c.dataset.m === m ? 7 : 5.5));
  const lb = document.querySelector(`#pchart .plbl[data-m="${m}"]`), tit = $('#ptit');
  if (lb && tit) { tit.style.left = lb.style.left; tit.style.top = (parseFloat(lb.style.top) - 42) + 'px'; }
  const det = $('#pdet');
  if (det) det.outerHTML = prevDetail(prevRow(m));
}
// Leva o gráfico até o mês (cada mês fica no centro quando scrollLeft = índice × largura).
function scrollPrevTo(m, smooth) {
  const pc = $('#pchart');
  if (!pc) return;
  const tabs = [...pc.querySelectorAll('.ptabs button')];
  const i = tabs.findIndex((b) => b.dataset.m === m);
  if (i >= 0) pc.scrollTo({ left: i * PCOL, behavior: smooth ? 'smooth' : 'auto' });
}
function setupPrevChart(oldScroll) {
  const pc = $('#pchart');
  if (!pc) return;
  const sp = Math.max(0, (pc.clientWidth - PCOL) / 2);
  pc.querySelectorAll('.psp').forEach((s) => { s.style.width = sp + 'px'; });
  if (oldScroll != null) { pc.scrollLeft = oldScroll; scrollPrevTo(ui.prevSel, true); } else scrollPrevTo(ui.prevSel, false);
  const tabs = pc.querySelectorAll('.ptabs button');
  pc.addEventListener('scroll', () => {
    const i = Math.max(0, Math.min(tabs.length - 1, Math.round(pc.scrollLeft / PCOL)));
    selectPrev(tabs[i].dataset.m);
  }, { passive: true });
}
// Arrastar o extrato (embaixo do gráfico) para o lado também troca de mês.
let pSwipe = null;
view.addEventListener('touchstart', (e) => {
  pSwipe = e.target.closest('#pdet') && e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
view.addEventListener('touchend', (e) => {
  if (!pSwipe) return;
  const t = e.changedTouches[0], dx = t.clientX - pSwipe.x, dy = t.clientY - pSwipe.y;
  pSwipe = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const tabs = [...document.querySelectorAll('#pchart .ptabs button')];
  const i = tabs.findIndex((b) => b.dataset.m === ui.prevSel) + (dx < 0 ? 1 : -1);
  if (tabs[i]) { scrollPrevTo(tabs[i].dataset.m, true); selectPrev(tabs[i].dataset.m); }
}, { passive: true });
const neg0 = (n) => (n < 0 ? 'out' : '');

function render() {
  $('#mlabel').textContent = monthLabel(ui.month);
  const noMonth = ui.tab === 'cfg' || ui.tab === 'inv' || ui.tab === 'prev';
  $('#top').classList.toggle('cfg', noMonth);
  $('#title').textContent = ui.tab === 'inv' ? 'Investimentos' : ui.tab === 'prev' ? 'Previsão' : 'Ajustes';
  $('#fab').classList.toggle('hide', noMonth);
  $('#tabs').classList.toggle('wide', noMonth);
  $('#mic').classList.toggle('hide', noMonth || !VOICE_ON);
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === ui.tab));
  const oldPc = $('#pchart'), oldScroll = oldPc ? oldPc.scrollLeft : null;
  view.innerHTML = ui.tab === 'sum' ? vSum() : ui.tab === 'list' ? vList() : ui.tab === 'inv' ? vInv() : ui.tab === 'prev' ? vPrev() : vCfg();
  // Previsão: centraliza o mês escolhido e liga o arraste.
  setupPrevChart(oldScroll);
}

/* ---------- eventos da tela ---------- */
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
  ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  duckOnTab();
}));
$('#prev').addEventListener('click', () => { ui.month = shiftMonth(ui.month, -1); render(); });
$('#next').addEventListener('click', () => { ui.month = shiftMonth(ui.month, 1); render(); });
$('#mlabel').addEventListener('click', () => { ui.month = today().slice(0, 7); render(); });
$('#fab').addEventListener('click', () => openSheet(null));
$('#mic').addEventListener('click', () => micTap());

view.addEventListener('input', (e) => {
  if (e.target.id === 'q') { ui.q = e.target.value; $('#listBody').innerHTML = listBody(); }
});

view.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'edit') { const id = el.dataset.id; openSheet(id.startsWith('r:') ? occById(id) : S.tx.find((t) => t.id === id)); }
  else if (a === 'bill') openBill(el.dataset.id);
  else if (a === 'fuel') openInv('fuel');
  else if (a === 'duck') { S.duck = el.dataset.v; save(); render(); duckStart(); if (S.duck !== 'off') duckSay(S.duck === 'chato' ? 'Agora sim. Vou te perturbar direitinho.' : 'Quack! Tô de volta.'); }
  else if (a === 'psel') { scrollPrevTo(el.dataset.m, true); selectPrev(el.dataset.m); }
  else if (a === 'update') forceUpdate();
  else if (a === 'theme') { S.theme = el.dataset.v; save(); applyTheme(); render(); }
  else if (a === 'pay') togglePay(el.dataset.kind, el.dataset.id, el.dataset.m);
  else if (a === 'payx') { const k = el.dataset.id + '|' + el.dataset.m; ui.payOpen = ui.payOpen === k ? null : k; render(); }
  else if (a === 'goMonth') { ui.month = el.dataset.m; ui.tab = 'sum'; render(); window.scrollTo(0, 0); }
  else if (a === 'inv-hist') { ui.invOpen = ui.invOpen === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a.startsWith('inv-')) openInv(a.slice(4), el.dataset.id);
  else if (a === 'addcard') addCard();
  else if (a === 'delcard') delCard(el.dataset.id);
  else if (a === 'month') { ui.month = el.dataset.m; render(); }
  else if (a === 'filter') { ui.f = el.dataset.f; render(); }
  else if (a === 'tipoff') { S.tipOff = true; save(); render(); }
  else if (a === 'exp-json') exportJSON();
  else if (a === 'exp-csv') exportCSV();
  else if (a === 'imp') $('#fileIn').click();
  else if (a === 'addcat') addCat();
  else if (a === 'delcat') delCat(el.dataset.id);
  else if (a === 'wipe') wipe();
});

/* ---------- folha de lançamento ---------- */
const F = { id: null, type: 'out', cat: null, group: null };
const wrap = $('#wrap');

function renderCatChips() {
  const cats = S.cats.filter((c) => c.type === F.type);
  if (!cats.some((c) => c.id === F.cat)) F.cat = cats.length ? cats[0].id : null;

$('#sheet').addEventListener('submit', (e) => {
  e.preventDefault();
  const amount = parseAmount($('#fAmount').value);
  if (!amount) { toast('Digite um valor'); $('#fAmount').focus(); return; }
  if (!F.cat) { toast('Crie uma categoria em Ajustes'); return; }
  const date = $('#fDate').value || today();
  const desc = $('#fDesc').value.trim();
  const card = F.type === 'out' && $('#fCard').checked && S.cards.length
    ? (S.cards.length > 1 ? $('#fCardSel').value : S.cards[0].id) : null;
  const fix = $('#fFix').checked;
  const nRaw = parseInt($('#fMonths').value, 10);
  const N = fix && nRaw >= 2 ? Math.min(360, nRaw) : null;
  const due = F.type === 'out' && $('#fDue').value ? $('#fDue').value : null; // vencimento (opcional)
  const vals = { type: F.type, amount, cat: F.cat, desc, card, due };
  if (F.rule) {
    // Editando um mês de um gasto fixo: a mudança vale deste mês em diante.
    const r = S.fixed.find((x) => x.id === F.rule);
    if (r) {
      const m = F.occMonth, sm = r.start.slice(0, 7);
      if (!fix) {
        endRuleBefore(r, m);
        S.tx.push({ id: uid(), ...vals, date, ts: Date.now() });
      } else if (m === sm) {
        Object.assign(r, vals, { start: date, n: N,
          end: N ? shiftMonth(date.slice(0, 7), Math.max(0, N - r.k0 - 1)) : null });
      } else {
        const k0 = r.k0 + monthDiff(sm, m);
        r.end = shiftMonth(m, -1);
        S.fixed.push({ id: uid(), ...vals, start: date, n: N, k0,
          end: N ? shiftMonth(date.slice(0, 7), Math.max(0, N - k0 - 1)) : null,
          skip: r.skip.filter((x) => x > m),
          pay: Object.fromEntries(Object.entries(r.pay || {}).filter(([k]) => k >= m)) });
      }
    }
  } else if (F.id) {
    const t = S.tx.find((x) => x.id === F.id);
    if (t && fix) { S.tx = S.tx.filter((x) => x !== t); addRule(vals, date, N); }
    else if (t) Object.assign(t, vals, { date });
  } else if (fix) {
    const nr = addRule(vals, date, N);
    duckOnSave({ ...vals, date, rule: true });
    setTimeout(() => duckMoney(nr, S.fixed), 380);
  } else {
    // combustível no débito já entra pago (igual ao "+ Abastecer")
    const novo = { id: uid(), ...vals, date, ts: Date.now(), ...(vals.cat === FUEL && !vals.card ? { paid: true } : {}) };
    S.tx.push(novo);
    duckOnSave(novo);
    setTimeout(() => duckMoney(novo), 380);
  }
  save();
  ui.month = date.slice(0, 7);
  closeSheet(); render(); toast('Salvo');
});

const txtField = (id, label, val = '', extra = '') => `<label class="flbl">${label}<input class="fld" id="${id}" value="${esc(val)}" ${extra}></label>`;
const calibField = `<label class="flbl">Quanto rendeu no último dia útil? (opcional)</label>
  <label class="amount" style="margin-top:0"><span>R$</span><input id="iCal" inputmode="decimal" placeholder="ex.: 0,415"></label>
  <p class="note">Faz o app render igual ao banco. Se no banco varia entre 0,41 e 0,42, digite <b>0,415</b>. Depois, toda vez que você atualizar o saldo, o app reajusta sozinho.</p>`;
const irField = (on) => `<label class="tog" style="margin-top:12px"><input type="checkbox" id="iIr" ${on ? 'checked' : ''}><span>Descontar IR (tabela regressiva, como o extrato do Mercado Pago)</span></label>`;
const startFields = (date) => txtField('iStart', 'Começou em', date, `type="date" max="${today()}"`)

// Valor em reais com até 4 casas → centavos (com fração). "0,415" → 41,5.
function parseFine(str) {
  let s = String(str).replace(/[^\d,.]/g, '');
  if (!s) return 0;
  s = s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s;
  const n = parseFloat(s);
  return Number.isFinite(n) && n > 0 ? n * 100 : 0;
}
// Reajusta a taxa pelo crescimento real entre o último saldo conferido e o de hoje,
// se não houve aplicação/resgate no meio e passaram pelo menos 5 dias úteis.
function calibBetween(v, a, b) {
  if (!a || !b || a.amount <= 0 || b.amount <= a.amount) return false;
  if (v.events.some((e) => e.type !== 'set' && e.date >= a.date && e.date <= b.date)) return false;
  const n = bizDaysBetween(a.date, b.date);
  if (n < 5) return false;
  setEff(v, toGross(v, Math.pow(b.amount / a.amount, 1 / n) - 1, b.date));
  return true;
}
function autoCalibrate(v, amt) {
  const t = today();
  const prev = v.events.filter((e) => e.type === 'set' && e.date < t).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  return calibBetween(v, prev, { date: t, amount: amt });
}
const firstEvent = (v) => [...v.events].sort((a, b) => (a.date < b.date ? -1 : 1))[0];
// Começou antes: cria o saldo inicial na data de início (o informado ou estimado de trás para frente pela taxa).
// Se o valor inicial foi informado, ele também reajusta a taxa (se passaram 5+ dias úteis).
function setStart(v, start, initAmt) {
  const first = firstEvent(v);
  if (!start || !first || start > today()) return false;
  if (start < first.date) {
    const amount = initAmt || Math.round(first.amount / Math.pow(1 + netRate(v, first.date), bizDaysBetween(start, first.date)));
    const ev = { date: start, type: 'set', amount };
    if (initAmt && first.type === 'set') calibBetween(v, ev, first);
    v.events.push(ev);
    return true;
  }
  if (start > first.date) {
    const next = [...v.events].sort((a, b) => (a.date < b.date ? -1 : 1))[1];
    if (next && start >= next.date) { toast('A data de início precisa ser antes das outras movimentações'); return false; }
    first.date = start;
  }
  if (initAmt && first.type === 'set') first.amount = initAmt;
  return true;
}

      setStart(nv, start, parseAmount($('#iStartAmt').value));

    if (!amt) { toast('Digite o saldo'); return; }

    const sameDay = v.events.find((x) => x.type === 'set' && x.date === today());
    if (autoCalibrate(v, amt)) msg = 'Saldo salvo e taxa reajustada pelo banco';
    if (sameDay) sameDay.amount = amt; else v.events.push({ date: today(), type: 'set', amount: amt });
  } else if (I.mode === 'cfg') {
    const pct = parsePct($('#iPct').value);

    const ir = $('#iIr').checked;
    if (ir !== (v.ir !== false) && Number.isFinite(v.eff) && v.eff > 0 && !cal) {
      const net = netRate(v, today()); v.ir = ir; setEff(v, toGross(v, net, today())); // mantém o valor líquido do dia
    }
    v.ir = ir;
    if (cal) setEff(v, toGross(v, cal / simulate(v, today()).end, today()));
    else if (pct !== v.pct) v.eff = null; // mudou o % do CDI sem calibrar: volta a calcular pelo CDI
    v.name = $('#iName').value.trim() || v.name;
    v.pct = pct;
    const start = $('#iStart').value, initAmt = parseAmount($('#iStartAmt').value);
    if (start && (start !== firstEvent(v).date || initAmt)) {
      const keep = v.eff;
      if (!setStart(v, start, initAmt)) return;
      if (cal) v.eff = keep; // o valor do dia digitado tem prioridade
    }
  } else if (I.mode === 'voice') {
    const text = $('#vText').value.trim();
    if (!text) { toast('Fale ou digite o lançamento'); return; }
    const p = parseVoice(text);
    closeWrap(wrap3);
    setTimeout(() => openPrefilled(p), 150);
    if (!p.amount) toast('Não peguei o valor: digite no campo');
    return;
  } else if (I.mode === 'fuel') {
    if (!amt) { toast('Digite quanto abasteceu'); return; }
    const date = $('#iDate').value || today();
    const ft = { id: uid(), type: 'out', amount: amt, cat: FUEL, desc: $('#iDesc').value.trim(), date, ts: Date.now(), card: null, paid: true };
    S.tx.push(ft);
    setTimeout(() => duckMoney(ft), 380);
    ui.month = date.slice(0, 7);

    if (duckLevel() !== 'off') setTimeout(() => duckSay(duckFresh([`Mais ${money(amt)} de gasolina. Esse carro bebe mais que você.`,
      'Abasteceu de novo? Vende esse carro e compra uma bicicleta.', `${money(amt)} no posto. O frentista te agradece.`])), 700);
  } else if (I.mode === 'cdi') {
    S.cdiAuto = $('#iCdiAuto').checked;
    if (S.cdiAuto) {
      refreshCdi(true).then((ok) => toast(ok ? `CDI atualizado: ${fmtPct(S.cdi)} ao ano` : 'Sem internet: fica o último CDI salvo'));
    } else {
      const c = parsePct($('#iCdi').value);
      if (!(c > 0 && c < 100)) { toast('Digite a taxa do CDI'); return; }
      S.cdi = c;
    }
  }
  save(); closeWrap(wrap3); render(); toast(msg);
});

async function shareFile(name, type, text) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return true;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return false;
  }
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
async function exportJSON() {

/* ---------- CDI automático ----------
   Busca o CDI anual (série 4389 do Banco Central, base 252) no máximo a cada 12 horas.
   Sem internet, fica o último valor salvo. */
async function refreshCdi(force) {
  if (S.cdiAuto === false) return false;
  if (!force && S.cdiAt && Date.now() - S.cdiAt < 12 * 3600e3) return false;
  try {
    const r = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.4389/dados/ultimos/1?formato=json', { cache: 'no-store' });
    const j = await r.json();
    const val = parseFloat(j[0].valor);
    if (!(val > 0 && val < 100)) return false;
    S.cdi = val; S.cdiDate = j[0].data; S.cdiAt = Date.now();
    save();
    if (ui.tab === 'inv') render();
    return true;
  } catch (e) { return false; }
}

/* ---------- lançar por voz ----------
   Usa o reconhecimento de voz do navegador (no iPhone, o ditado da Apple). Se não houver ou for bloqueado,
   o campo de texto aceita o ditado do teclado. A frase é interpretada aqui mesmo, sem internet de IA. */
const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const VOICE_KEYS = {
  out: [
    [/\b(supermercado|mercado|feira|atacadao|assai|hortifruti)\b/, 'mercado'],
    [/\b(gasolina|etanol|alcool|combustivel|abasteci|abastecimento|posto)\b/, 'combustivel'],
    [/\b(ifood|pizza|lanche|hamburguer|restaurante|almoco|jantar|cafe|padaria|acai|sorvete|marmita)\b/, 'restaurantes'],
    [/\b(carro|veiculo|moto|uber|onibus|metro|estacionamento|pedagio|oficina|mecanico|lava jato|pneu|ipva|licenciamento|multa|revisao|oleo|borracharia|alinhamento|seguro do carro)\b/, 'transporte'],
    [/\b(farmacia|remedio|medico|consulta|exame|dentista|hospital)\b/, 'saude'],
    [/\b(cinema|bar|show|jogo|balada|viagem|passeio)\b/, 'lazer'],
    [/\b(luz|energia|agua|internet|telefone|celular|gas)\b/, 'contas'],
    [/\b(roupa|tenis|loja|shopee|amazon|shein|presente|mercado livre)\b/, 'compras'],
    [/\b(aluguel|condominio|iptu|movel|moveis)\b/, 'moradia'],
  ],
  in: [
    [/\b(salario)\b/, 'salario'],
    [/\b(freela|extra|bico|venda|vendi)\b/, 'extra'],
  ],
};
function parseVoice(raw) {
  let t = ' ' + norm(raw) + ' ';
  const p = { type: 'out', amount: 0, cat: null, card: null, date: today(), desc: '' };
  // data ("ontem", "anteontem", "dia 5") — sai do texto antes de procurar o valor
  const d0 = new Date();
  if (/\banteontem\b/.test(t)) { d0.setDate(d0.getDate() - 2); p.date = iso(d0); }
  else if (/\bontem\b/.test(t)) { d0.setDate(d0.getDate() - 1); p.date = iso(d0); }
  const dm = t.match(/\bdia (\d{1,2})\b/);
  if (dm) {
    const day = +dm[1], cm = today().slice(0, 7), dim = new Date(+cm.slice(0, 4), +cm.slice(5, 7), 0).getDate();
    if (day >= 1) p.date = `${cm}-${pad(Math.min(day, dim))}`;
    t = t.replace(dm[0], ' ');
  }
  // valor: "80", "80,50", "1.500", "R$ 80", "80 reais e 50 centavos"
  const m = t.match(/(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d{1,2})|\.(\d{1,2})(?!\d))?/);
  if (m) {
    const cents = m[2] || m[3];
    p.amount = parseInt(m[1].replace(/\./g, ''), 10) * 100 + (cents ? parseInt(cents.padEnd(2, '0'), 10) : 0);
    const c = t.slice(m.index + m[0].length).match(/^\s*(?:reais|real|conto)?\s*e\s*(\d{1,2})\s*centavos?/);
    if (c && !cents) p.amount += parseInt(c[1], 10);
  }
  // receita ou despesa
  if (/\b(recebi|ganhei|entrou|caiu|vendi|salario|freela)\b/.test(t)) p.type = 'in';
  // cartão: pelo nome; "crédito"/"cartão" sem nome = primeiro cartão; débito/pix/dinheiro = sem cartão
  if (p.type === 'out') {
    // o nome do cartão sai do texto ("Mercado Pago" não pode virar a categoria Mercado)
    for (const c of S.cards) if (t.includes(norm(c.name))) { p.card = c.id; t = t.split(norm(c.name)).join(' '); }
    if (!p.card && /\b(credito|cartao)\b/.test(t) && S.cards.length) p.card = S.cards[0].id;
    if (/\b(debito|pix|dinheiro)\b/.test(t)) p.card = null;
  }
  // categoria: pelo nome das suas categorias, senão por palavra-chave
  const cats = S.cats.filter((c) => c.type === p.type);
  for (const c of cats) if (new RegExp('\\b' + norm(c.name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(t)) { p.cat = c.id; break; }
  for (const [re, id] of VOICE_KEYS[p.type]) {
    const k = t.match(re);
    if (k) { if (!p.cat && cats.some((c) => c.id === id)) p.cat = id; if (!p.desc) p.desc = voiceDesc(raw, k[0].trim()); break; }
  }
  // nada reconhecido: "Outros" (e não a primeira da lista, que é Mercado)
  if (!p.cat) { const o = cats.find((c) => c.id === (p.type === 'in' ? 'outros-in' : 'outros')); if (o) p.cat = o.id; }
  return p;
}
// Descrição com a palavra como foi falada (com acento): "farmácia" → "Farmácia".
const VOICE_DESC = { abasteci: 'Abastecimento', vendi: 'Venda', movel: 'Móveis' };
function voiceDesc(raw, key) {
  if (VOICE_DESC[key]) return VOICE_DESC[key];
  const n = key.split(' ').length;
  const words = String(raw).split(/\s+/);
  for (let i = 0; i + n <= words.length; i++) {
    const chunk = words.slice(i, i + n).join(' ');
    if (norm(chunk).replace(/[^\w ]/g, '') === key) return cap(chunk.replace(/[^\p{L}\p{N} ]/gu, ''));
  }
  return cap(key);
}

let rec = null, listening = false;
function setListenUI(on, msg) {

// No iPhone (app na tela de início) o reconhecimento às vezes abre o microfone e nunca devolve texto.
// Por isso: modo contínuo no iOS, para sozinho 1,5 s depois da última palavra, e se em 6 s não vier
// nada, desiste e pede para usar o ditado do teclado (que sempre funciona). A linha pequena mostra os
// eventos do microfone para diagnóstico.
// Botão de voz escondido por enquanto (no iPhone a voz só funciona uma vez por abertura do app).
// Para voltar a mostrar: VOICE_ON = true.
const VOICE_ON = false;
let listenTimers = [], voiceRec = null, voiceUsed = false;
// No iPhone a voz costuma funcionar só uma vez por abertura do app. Depois do 1º uso, tocar no 🎤
// recarrega o app (os dados ficam) e já reabre a janela de voz ouvindo.
function micTap() {

  }

}
const clearListenTimers = () => { listenTimers.forEach(clearTimeout); listenTimers = []; };
function vDiag(tag) { const d = $('#vDiag'); if (d) d.textContent = (d.textContent ? d.textContent + ' › ' : '') + tag; }
function keyboardFallback(msg) {
  setListenUI(false, msg);
  const f = $('#vText');
  if (f) { f.classList.add('hl'); f.placeholder = 'Toque aqui e use o 🎤 do teclado'; }
}
function startListen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { keyboardFallback('Este navegador não ouve por aqui: toque no campo abaixo e use o 🎤 do teclado.'); return; }
  stopListen();
  if ($('#vDiag')) $('#vDiag').textContent = '';
  let text = '', gotResult = false, submitted = false;
  const finish = () => {
    clearListenTimers();
    if (submitted) return;
    if (text && !wrap3.hidden) { submitted = true; stopListen(); setListenUI(false, 'Entendi!'); $('#sheet3').requestSubmit(); }
  };
  try {
    rec = voiceRec || (voiceRec = new SR()); // o mesmo "ouvinte" sempre (criar outro falha em alguns iPhones)
    voiceUsed = true;
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = isIOS; rec.maxAlternatives = 1;
    rec.onstart = () => vDiag('início');
    rec.onaudiostart = () => vDiag('microfone');
    rec.onspeechstart = () => vDiag('voz');
    rec.onresult = (e) => {
      if (!gotResult) vDiag('texto');
      gotResult = true;
      text = Array.from(e.results).map((r) => r[0].transcript).join(' ').replace(/\s+/g, ' ').trim();
      if ($('#vText')) $('#vText').value = text;
      clearListenTimers();
      listenTimers.push(setTimeout(finish, e.results[e.results.length - 1].isFinal && !isIOS ? 300 : 1500));
    };
    rec.onerror = (e) => {
      vDiag('erro: ' + e.error);
      clearListenTimers();
      const blocked = e.error === 'not-allowed' || e.error === 'service-not-allowed';
      if (blocked || e.error === 'audio-capture') keyboardFallback('O iPhone não liberou a voz aqui: toque no campo abaixo e use o 🎤 do teclado.');
      else if (e.error === 'no-speech') setListenUI(false, 'Não ouvi nada. Toque no microfone e tente de novo.');
      else if (e.error !== 'aborted') keyboardFallback('Não consegui ouvir: toque no campo abaixo e use o 🎤 do teclado.');
    };
    rec.onend = () => {
      vDiag('fim');
      rec = null;
      if (text) finish();
      else if (listening) setListenUI(false, 'Toque no microfone e fale.');
    };
    rec.start();
    setListenUI(true, 'Ouvindo… pode falar.');
    // 6 s sem nenhum texto: o reconhecimento travou (comum no iPhone) → plano B
    listenTimers.push(setTimeout(() => {
      if (gotResult) return;
      stopListen();
      keyboardFallback('A voz do iPhone não respondeu: toque no campo abaixo e use o 🎤 do teclado.');
    }, 6000));
  } catch (err) {
    vDiag('erro ao ligar');
    keyboardFallback('Não consegui ligar o microfone: toque no campo abaixo e use o 🎤 do teclado.');
  }
}
function stopListen() {
  clearListenTimers();
  if (rec) { try { rec.abort(); } catch (e) {} rec = null; }
  listening = false;
  const b = $('#vMic'); if (b) b.classList.remove('on');
}

document.querySelectorAll('.wrap:not(#wrapC) .sheet').forEach((sheet) => {

  x.addEventListener('click', () => closeWrap(w));
